[project]
name = "chronos-ledger-backend"
version = "0.16.0"
description = "Chronos Ledger: Organization Schedule & Attendance Management Backend"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Chronos Ledger Contributors" }
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    # From 2.1 a bare postgresql:// URL, which the config default, both compose
    # files and the CI PostgreSQL job all use, means psycopg (3). The floor
    # keeps it from meaning psycopg2 on an older SQLAlchemy.
    "sqlalchemy>=2.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2.1",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.0",
    # PyJWT replaces python-jose (CVE-2022-29217 in jose; jose also unmaintained)
    "PyJWT[crypto]>=2.10.1",
    # bcrypt directly replaces passlib (passlib unmaintained since 2023)
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "apscheduler>=3.10.4",
    "httpx>=0.28.1",
    "websockets>=14.1",
    "pywebpush>=2.0.3",
    "aiofiles>=24.1.0",
    "email-validator>=2.2.0",
    # zoneinfo reads the operating system's zone database, and a slim image
    # ships without one. ORG_TIMEZONE would then fail for every name but UTC,
    # on the deployment shape most likely to be used.
    "tzdata>=2024.2",
    # Expands a slot's RFC 5545 rule (app/core/recurrence.py). It came in
    # through pandas before; the engine uses it directly now.
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
# chronos-engine: one process on a SQLite file, no Redis. docs/standalone.md.
standalone = [
    "fakeredis>=2.26.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
chronos-engine = "app.standalone:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI Depends pattern)
    "SIM108", # ternary operator, sometimes less readable
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
