[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Overridden at runtime by env/alembic/env.py which reads DATABASE_URL.
# Set DATABASE_URL in your shell or .env file, never commit credentials here.
sqlalchemy.url = postgresql://chronos_admin:CHANGE_ME@localhost:5432/chronos_ledger

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
