apiVersion: v1
kind: Service
metadata:
  # chronos-app by default: the nginx.conf in the web image dials that name.
  name: {{ .Values.backend.service.name }}
  labels:
    {{- include "chronos-ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "chronos-ledger.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
