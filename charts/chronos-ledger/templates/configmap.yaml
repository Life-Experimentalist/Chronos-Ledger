apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chronos-ledger.fullname" . }}-config
  labels:
    {{- include "chronos-ledger.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.config }}
  {{- /* Helm reads a number as a float, which prints 1000000 as 1e+06. */}}
  {{- if and (kindIs "float64" $value) (eq $value (floor $value)) }}
  {{ $key }}: {{ printf "%.0f" $value | quote }}
  {{- else }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
