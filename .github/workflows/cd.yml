name: CD (Build & Push to GHCR)

# Copyright 2026 Chronos Ledger Contributors (Apache 2.0)
#
# Called by the CI workflow once every gate on main has passed, and by the
# release workflow with an explicit version tag. It has no trigger of its own
# on purpose: a workflow that publishes to a public registry should never be
# reachable by a push that nothing has checked.

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version tag (e.g. v1.2.0). Defaults to "latest".
        type: string
        required: false
        default: latest

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/chronos-ledger-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/chronos-ledger-web

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # ── Backend image ──────────────────────────────────────────────────────
      - name: Extract metadata, backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version || 'latest' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Chronos Ledger Backend
            org.opencontainers.image.description=FastAPI application for Chronos Ledger
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: true
          sbom: true

      # ── Web image (nginx + pre-built Next.js static files) ────────────────
      - name: Extract metadata, web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.version || 'latest' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Chronos Ledger Web
            org.opencontainers.image.description=Nginx + Next.js static export for Chronos Ledger
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=
