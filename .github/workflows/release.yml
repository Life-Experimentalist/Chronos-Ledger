name: Release

# Copyright 2026 Chronos Ledger Contributors (Apache 2.0)
#
# Automated releases using Release Please (google-github-actions/release-please-action).
#
# Called by the CI workflow once every gate on main has passed. It has no
# trigger of its own on purpose: what this builds is a changelog, and a commit
# that failed its tests does not belong on one.
#
# How it works:
#   1. Every commit that passes CI on main is inspected for conventional
#      commits (feat, fix, chore, etc).
#   2. Release Please maintains an open "Release PR" that accumulates the changelog.
#   3. When you merge that PR, a GitHub Release is created and this workflow builds
#      + pushes versioned Docker images to GHCR and Docker Hub.
#
# Commit message convention:
#   feat: add X         → bumps MINOR version
#   fix: resolve Y      → bumps PATCH version
#   feat!: breaking Z   → bumps MAJOR version
#   chore/docs/refactor → no version bump (skipped in release PR)

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: >-
          Optional. Handed straight to release-please, which falls back to
          GITHUB_TOKEN when it is empty. Declared here because a called
          workflow cannot read a repository secret the caller did not pass it.
        required: false
      DOCKERHUB_USERNAME:
        description: Optional. Passed straight through to cd.yml.
        required: false
      DOCKERHUB_TOKEN:
        description: Optional. Passed straight through to cd.yml.
        required: false

jobs:
  # ── Step 1: Let Release Please manage the release PR ─────────────────────
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Job-level, because a called workflow's token is capped by the calling
    # job's permissions anyway and one place to read is better than two.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      upload_url: ${{ steps.rp.outputs.upload_url }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: simple
          # Bumps version.txt at the repo root.
          # The release PR title follows "chore(release): vX.Y.Z"
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  # ── Step 2: On actual release, build versioned images ────────────────────
  build-release-images:
    name: Build & push versioned images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/cd.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # ── Step 3: Attach docker-compose.prod.yml to the GitHub Release ──────────
  attach-compose:
    name: Attach prod compose to release
    needs: [release-please, build-release-images]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Stamp release version into docker-compose.prod.yml
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          sed "s|:latest|:${VERSION}|g" docker-compose.prod.yml > docker-compose.prod.release.yml

      - name: Upload to release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: docker-compose.prod.release.yml
          asset_name: docker-compose.prod.yml
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
