name: GitHub Pages — Landing

# Copyright 2026 Chronos Ledger Contributors — Apache 2.0
#
# Builds the Next.js landing page as a static export and deploys it to
# GitHub Pages at https://<org>.github.io/Chronos-Ledger/

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build static export
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Chronos-Ledger
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
          NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
          NEXT_PUBLIC_TELEMETRY_ENDPOINT: ""

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
