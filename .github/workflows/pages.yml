name: GitHub Pages (Landing)

# Copyright 2026 Chronos Ledger Contributors (Apache 2.0)
#
# Deploys the standalone docs/index.html to GitHub Pages.
# No build step, pure static HTML/CSS/JS.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only the landing page and what it loads. Uploading docs/ as a whole
      # published the Markdown, the OpenAPI file and desktop.ini as raw files.
      - name: Stage the landing page
        run: |
          mkdir -p _site
          cp docs/index.html docs/logo.svg docs/icon.png docs/favicon-32.png              docs/apple-touch-icon.png docs/robots.txt docs/sitemap.xml _site/
          # The CLI install scripts, served as https://chronos.vkrishna04.me/install.sh
          cp docs/install.sh docs/install.ps1 _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
