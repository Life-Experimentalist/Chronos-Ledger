name: CI

# Copyright 2026 Chronos Ledger Contributors (Apache 2.0)
#
# Runs on every pull request and on every push to main.
# All jobs must pass before a branch can merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # So a branch without a pull request can be checked by hand. Publishing
  # stays gated on a push to main below.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is wasted compute and worth cancelling. A run
  # on main is not: it ends by publishing, and cancelling it halfway can leave
  # the backend image and the web image on the registry from two different
  # commits until the next run finishes. Pushes to main queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Backend: lint ──────────────────────────────────────────────────────────
  backend-lint:
    name: Backend, ruff lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dev dependencies
        run: uv sync --frozen --dev --no-install-project

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

  # ── Backend: tests ──────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend tests (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version pyproject.toml accepts, and the one the image runs.
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --dev

      # The floor sits at the coverage measured when it was added. Raise it
      # when coverage rises; lowering it needs a reason in the pull request.
      - name: Run pytest
        run: uv run python -m pytest tests/ -q --cov=app --cov-report=term --cov-fail-under=93

  # ── Backend: the tests that need PostgreSQL ─────────────────────────────────
  # The suite above runs on in-memory SQLite, which has no exclusion
  # constraints, so the guarantees production leans on (no double booking, one
  # ledger day per slot, attendance outliving its account) are only proven
  # here. Each file gets an empty database because each one builds the schema
  # from the models and then asks the catalog what arrived.
  backend-test-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # The version the compose files run.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chronos_ci
          POSTGRES_PASSWORD: chronos_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: chronos_ci
      PGPASSWORD: chronos_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run the PostgreSQL tests, one empty database each
        run: |
          status=0
          for file in tests/*_pg.py; do
            name="ci_$(basename "$file" .py)"
            psql -d postgres -qc "CREATE DATABASE $name"
            TEST_DATABASE_URL="postgresql://chronos_ci:chronos_ci@localhost:5432/$name" \
              uv run python -m pytest "$file" -q -rs || status=1
          done
          exit $status

  # ── Backend: the embedded flavour on Windows ────────────────────────────────
  # The only place the Windows branches of the stdin watcher and parent_alive
  # run. A subset of the suite, so no coverage floor here.
  backend-test-windows:
    name: Backend, the embedded flavour on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run the embedded tests
        run: uv run python -m pytest tests/test_embedded.py tests/test_embedded_clock.py -q -rs

  # ── Frontend: lint + type-check + build ───────────────────────────────────
  frontend-check:
    name: Frontend, lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
          NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
          NEXT_PUBLIC_TELEMETRY_ENDPOINT: ""

  # ── Security: Trivy filesystem vulnerability scan ─────────────────────────
  security-scan:
    name: Security (Trivy scan)
    runs-on: ubuntu-latest
    permissions:
      # Naming any scope sets every other one to none, so checkout needs
      # saying out loud. It matters more now that publishing waits on this job.
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Two passes, because they answer different questions. The first one
      # reports: everything critical and everything high, written to the
      # Security tab so somebody can triage it without reading a build log.
      # The second one blocks, and only on critical, so a known-exploitable
      # dependency cannot reach the registry while the merely-worrying ones
      # do not hold up a release nobody would otherwise stop.
      - name: Trivy scan, report every finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif

      # Runs after the upload on purpose. This is the step allowed to fail,
      # and the Security tab should already have the findings by the time it
      # does. ignore-unfixed stays on: a critical with no patch published
      # anywhere would otherwise block every build until upstream moves, which
      # turns the gate into something people switch off.
      - name: Trivy scan, fail the build on anything critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Only this step reads the suppressions, so anything listed in that
          # file still reaches the Security tab through the pass above. Every
          # entry carries its reasoning and a date it expires on.
          trivyignores: .trivy-release-gate.yaml
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

  # ── Docker: verify both images build cleanly ──────────────────────────────
  docker-build-check:
    name: Docker, build check (no push)
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-check]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build web image (nginx + Next.js)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws
            NEXT_PUBLIC_TELEMETRY_ENABLED=false
            NEXT_PUBLIC_TELEMETRY_ENDPOINT=

  # ── CLI: format, lint, test on each OS it ships for ───────────────────────
  cli-check:
    name: CLI, cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # ── SDKs: generated code is current, and the hand-written layer passes ────
  sdk-typescript:
    name: SDK, TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - run: npm ci

      # A spec change that was not regenerated fails here.
      - name: Generated types match docs/openapi.yaml
        run: |
          npm run generate
          git diff --exit-code -- src/generated

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: SDK, Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock

      - run: uv sync --frozen

      - name: Generated client matches docs/openapi.yaml
        run: |
          uvx --from openapi-python-client==0.29.1 openapi-python-client generate             --path ../../docs/openapi.yaml --meta none --config openapi-python-client.yaml             --output-path src/chronos_ledger_client/generated --overwrite
          rm -rf src/chronos_ledger_client/generated/.ruff_cache
          git status --porcelain -- src/chronos_ledger_client/generated
          test -z "$(git status --porcelain -- src/chronos_ledger_client/generated)"

      - run: uv run ruff format --check .
      - run: uv run ruff check . --output-format=github
      - run: uv run pytest -q

  # ── Publish: only reachable once every gate above is green ────────────────
  publish:
    name: Publish images to GHCR and Docker Hub
    # This is the CI gate the registry never had. The build workflow used to
    # carry its own push-to-main trigger, so it raced this one and a commit
    # that failed its tests still shipped :latest to a public registry.
    needs: [backend-lint, backend-test, frontend-check, security-scan, docker-build-check, cli-check, sdk-typescript, sdk-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/cd.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ── Release: the same gate, for the release PR and its images ─────────────
  release:
    name: Release
    # The same hole as publish had, one workflow over: release.yml carried its
    # own push-to-main trigger and reached the build workflow without waiting
    # for anything here. Smaller, since a release commit is a version file and
    # a changelog over code this has already seen, but the same shape.
    needs: [backend-lint, backend-test, frontend-check, security-scan, docker-build-check, cli-check, sdk-typescript, sdk-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
