name: CI

# Copyright 2026 Chronos Ledger Contributors — Apache 2.0
#
# Runs on every pull request and on every push to main.
# All jobs must pass before a branch can merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint ──────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — ruff lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dev dependencies
        run: uv sync --frozen --dev --no-install-project

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

  # ── Frontend: lint + type-check + build ───────────────────────────────────
  frontend-check:
    name: Frontend — lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run type-check

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
          NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
          NEXT_PUBLIC_TELEMETRY_ENDPOINT: ""

  # ── Security: Trivy filesystem vulnerability scan ─────────────────────────
  security-scan:
    name: Security — Trivy scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ── Docker: verify both images build cleanly ──────────────────────────────
  docker-build-check:
    name: Docker — build check (no push)
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-check]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build web image (nginx + Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws
            NEXT_PUBLIC_TELEMETRY_ENABLED=false
            NEXT_PUBLIC_TELEMETRY_ENDPOINT=
