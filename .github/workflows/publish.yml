name: Publish

# Copyright 2026 Chronos Ledger Contributors (Apache 2.0)
#
# Publishes the CLI and the SDKs of one release to npm, PyPI and crates.io, and
# tags the Go module. release.yml starts this after it has attached the CLI
# binaries to a release; it can also be run by hand:
#
#   gh workflow run publish.yml -f tag=v0.18.0
#
# This file is a top-level workflow on purpose, and its name is part of the setup.
# The trusted publishers on npm, PyPI and crates.io are registered against the
# workflow file name `publish.yml`, so it cannot be renamed or turned into a
# reusable workflow without registering them again.
#
# No secrets are used anywhere. Every registry accepts the short-lived OIDC token
# this workflow is issued. Each registry channel stays off until its repository
# variable is "true": NPM_PUBLISH, PYPI_PUBLISH, CRATES_PUBLISH. The Go tag is not
# gated, because creating a tag publishes nothing to anyone's account.
#
# Every job is safe to run again for the same tag: a version already on a
# registry is skipped, and an existing Go tag is left alone. The one-time setup
# is in docs/publishing.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.18.0
        required: true
        type: string

run-name: Publish ${{ inputs.tag }}

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Checks the tag, then fetches the CLI binaries the release already carries.
  # Every other job waits for this one, so a mistyped tag stops everything.
  assets:
    name: Release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like v1.2.3, got: $TAG"
            exit 1
          fi

      - name: Download the CLI binaries and checksums
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --pattern 'chronos-v*'
          ls -l assets
          # Six binaries and six checksum files.
          [ "$(ls assets | wc -l)" -eq 12 ]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-assets
          path: assets/*
          if-no-files-found: error

  # npm. Trusted publishing, so no environment and no token. Needs npm 11.5.1 or
  # newer, which is newer than the npm that ships with Node 24.
  npm-cli:
    name: npm, chronosledger
    needs: assets
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-assets
          path: assets

      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@11
          npm --version
          [ "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -n 1)" = "11.5.1" ]

      - name: Build the six platform packages and the dispatcher
        run: sh scripts/npm-prepare.sh "$TAG" assets npm-out

      - name: Publish, platform packages first
        run: sh scripts/npm-publish.sh npm-out

  npm-sdk:
    name: npm, chronosledger-client
    needs: assets
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@11
          npm --version
          [ "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -n 1)" = "11.5.1" ]

      - name: Install and build
        working-directory: sdks/typescript
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Publish
        run: |
          set -eu
          dir="$PWD/sdks/typescript"
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' "$dir/package.json")
          # release-please stamps this file; a mismatch means the stamp broke.
          [ "$version" = "${TAG#v}" ] || { echo "::error::package.json says $version, tag says $TAG"; exit 1; }
          if npm view "chronosledger-client@$version" version >/dev/null 2>&1; then
            echo "chronosledger-client@$version is already on npm, skipping."
            exit 0
          fi
          npm publish "$dir" --access public --provenance

  # PyPI. Trusted publishing, bound to this workflow file and the `pypi` environment.
  pypi-cli:
    name: PyPI, chronosledger
    needs: assets
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronosledger
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-assets
          path: assets

      # Into a directory of its own: the publish action uploads everything it finds in
      # the directory it is pointed at.
      - name: Build the wheels from the release assets
        run: python3 scripts/build_wheels.py "$TAG" assets wheels

      # The wheel metadata is written by hand, so check it before PyPI sees it.
      - name: Check the wheels
        run: pipx run twine check --strict wheels/*.whl

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: wheels
          skip-existing: true

  pypi-sdk:
    name: PyPI, chronosledger-client
    needs: assets
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chronosledger-client
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the sdist and the wheel
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' sdks/python/pyproject.toml | head -n 1)
          [ "$version" = "${TAG#v}" ] || { echo "::error::pyproject.toml says $version, tag says $TAG"; exit 1; }
          uv build sdks/python --out-dir sdk-dist

      - name: Check the distributions
        run: pipx run twine check --strict sdk-dist/*

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk-dist
          skip-existing: true

  # crates.io. Trusted publishing, bound to this workflow file and the `crates-io`
  # environment. A crate has to exist before a trusted publisher can be added to it,
  # so the first version of each is published from a workstation (docs/publishing.md).
  crates-cli:
    name: crates.io, chronosledger
    needs: assets
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/chronosledger
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: cargo publish
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$version" = "${TAG#v}" ] || { echo "::error::Cargo.toml says $version, tag says $TAG"; exit 1; }
          # crates.io answers 403 to a request without a descriptive User-Agent, which
          # would read as "not published" and try to publish the same version again.
          ua="chronosledger-publish/$version (https://github.com/${GITHUB_REPOSITORY})"
          if curl -sfL -A "$ua" "https://crates.io/api/v1/crates/chronosledger/$version" >/dev/null; then
            echo "chronosledger $version is already on crates.io, skipping."
            exit 0
          fi
          cargo publish --locked

  crates-sdk:
    name: crates.io, chronosledger-client
    needs: assets
    if: vars.CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/chronosledger-client
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: cargo publish
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$version" = "${TAG#v}" ] || { echo "::error::Cargo.toml says $version, tag says $TAG"; exit 1; }
          ua="chronosledger-publish/$version (https://github.com/${GITHUB_REPOSITORY})"
          if curl -sfL -A "$ua" "https://crates.io/api/v1/crates/chronosledger-client/$version" >/dev/null; then
            echo "chronosledger-client $version is already on crates.io, skipping."
            exit 0
          fi
          cargo publish --locked

  # Go has no registry to publish to. A module in a subdirectory is versioned by a tag
  # with that directory as a prefix, so this creates sdks/go/<tag> at the release
  # commit. Not gated: it uploads nothing and needs no account.
  go-tag:
    name: Go module tag
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Create the tag if it is missing
        run: |
          set -eu
          go_tag="sdks/go/$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$go_tag" >/dev/null; then
            echo "$go_tag already exists, leaving it alone."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$go_tag" -m "Go module chronos.vkrishna04.me/sdks/go $TAG" HEAD
            git push origin "refs/tags/$go_tag"
          fi

      # Asking the proxy for the version makes it fetch and cache the module now, so
      # the first `go get` does not have to wait for it.
      - name: Ask the Go proxy for the new version
        run: |
          url="https://proxy.golang.org/chronos.vkrishna04.me/sdks/go/@v/$TAG.info"
          for attempt in 1 2 3 4 5; do
            if curl -sfL "$url"; then
              echo
              exit 0
            fi
            echo "attempt $attempt: the proxy does not have it yet"
            sleep 10
          done
          echo "::error::proxy.golang.org did not return $url"
          exit 1

  # One table of what happened, so a green run that published nothing cannot pass
  # for a run that published everything.
  summary:
    name: What was published
    needs: [assets, npm-cli, npm-sdk, pypi-cli, pypi-sdk, crates-cli, crates-sdk, go-tag]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAG: ${{ inputs.tag }}
      ASSETS: ${{ needs.assets.result }}
      NPM_CLI: ${{ needs.npm-cli.result }}
      NPM_SDK: ${{ needs.npm-sdk.result }}
      PYPI_CLI: ${{ needs.pypi-cli.result }}
      PYPI_SDK: ${{ needs.pypi-sdk.result }}
      CRATES_CLI: ${{ needs.crates-cli.result }}
      CRATES_SDK: ${{ needs.crates-sdk.result }}
      GO_TAG: ${{ needs.go-tag.result }}
      NPM_ON: ${{ vars.NPM_PUBLISH }}
      PYPI_ON: ${{ vars.PYPI_PUBLISH }}
      CRATES_ON: ${{ vars.CRATES_PUBLISH }}
    steps:
      - name: Write the table
        run: |
          set -eu
          # describe <job result> <variable value> <variable name>
          describe() {
            case "$1" in
              success)   echo "published" ;;
              failure)   echo "**failed** (see the job log)" ;;
              cancelled) echo "**cancelled**" ;;
              skipped)
                if [ "$2" = "true" ]; then
                  echo "**not run** (an earlier job failed)"
                else
                  echo "skipped, set the repository variable \`$3\` to \`true\` to enable"
                fi ;;
              *)         echo "$1" ;;
            esac
          }
          {
            echo "## Publish $TAG"
            echo
            echo "| Channel | Package | Result |"
            echo "|---|---|---|"
            echo "| Release assets | six binaries | $(describe "$ASSETS" true x) |"
            echo "| npm | chronosledger and 6 platform packages | $(describe "$NPM_CLI" "$NPM_ON" NPM_PUBLISH) |"
            echo "| npm | chronosledger-client | $(describe "$NPM_SDK" "$NPM_ON" NPM_PUBLISH) |"
            echo "| PyPI | chronosledger | $(describe "$PYPI_CLI" "$PYPI_ON" PYPI_PUBLISH) |"
            echo "| PyPI | chronosledger-client | $(describe "$PYPI_SDK" "$PYPI_ON" PYPI_PUBLISH) |"
            echo "| crates.io | chronosledger | $(describe "$CRATES_CLI" "$CRATES_ON" CRATES_PUBLISH) |"
            echo "| crates.io | chronosledger-client | $(describe "$CRATES_SDK" "$CRATES_ON" CRATES_PUBLISH) |"
            echo "| Go | chronos.vkrishna04.me/sdks/go, tag sdks/go/$TAG | $(describe "$GO_TAG" true x) |"
            echo
            echo "A version that was already on a registry counts as published here."
          } >> "$GITHUB_STEP_SUMMARY"
