services:
  chronos-proxy:
    image: nginx:1.27-alpine
    container_name: chronos_edge_proxy
    ports:
      # Host side only. The container still listens on 80 and 443; these say
      # where they surface. Another compose file that wants the host's own 80
      # and 443 (an outer proxy fronting several stacks) can move Chronos aside
      # with EDGE_HTTP_PORT and EDGE_HTTPS_PORT instead of editing this file.
      # The defaults are the ports that were hardcoded here before.
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/chronos-common.conf:/etc/nginx/chronos-common.conf:ro
      - ./nginx/tls-server.conf:/etc/nginx/tls-server.conf:ro
      # The stock nginx image runs /docker-entrypoint.d/ scripts at start;
      # 40-tls.sh enables :443 only when certs/ holds a certificate pair.
      - ./nginx/40-tls.sh:/docker-entrypoint.d/40-tls.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      chronos-app:
        condition: service_healthy
      # Wait for build to COMPLETE (not just start) before nginx serves files.
      chronos-frontend:
        condition: service_completed_successfully
    restart: always
    networks:
      - chronos_net

  chronos-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: chronos_frontend_builder
    # One-shot builder: exits 0 after writing static files to the shared volume.
    # restart: no is intentional, we don't want this container to restart.
    restart: 'no'
    volumes:
      - frontend_build:/app/out
    networks:
      - chronos_net

  chronos-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronos_core_engine
    environment:
      - DATABASE_URL=postgresql://chronos_admin:${DB_PASSWORD:-SecureCloud2026}@chronos-db:5432/chronos_ledger
      - REDIS_URL=${REDIS_URL:-redis://chronos-cache:6379/0}
      - JWT_SECRET_SIGNING_KEY=${JWT_SECRET_SIGNING_KEY:?set JWT_SECRET_SIGNING_KEY before compose up}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # The first password for the seeded administrator account, applied at
      # boot while that account is still unused. Empty leaves it
      # unreachable, which is deliberate: there is no default to find in
      # this repository.
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-12}
      # A budget per caller on sign-in, the visitor kiosk and the calendar
      # feed, counted in Redis. Any count at 0 turns that one off, and
      # RATE_LIMIT_ENABLED=false turns off all three.
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_LOGIN_PER_IP=${RATE_LIMIT_LOGIN_PER_IP:-10}
      - RATE_LIMIT_LOGIN_PER_EMAIL=${RATE_LIMIT_LOGIN_PER_EMAIL:-5}
      - RATE_LIMIT_GUEST_CHECKIN=${RATE_LIMIT_GUEST_CHECKIN:-300}
      - RATE_LIMIT_CALENDAR_FEED=${RATE_LIMIT_CALENDAR_FEED:-60}
      # Which upstream addresses uvicorn believes X-Forwarded-For from. This
      # service publishes no ports, so nginx is the only way in. Without it
      # every request looks like it came from the proxy and the sign-in
      # limit counts the whole organization as one caller. Safe because
      # nginx overwrites that header rather than appending to it, so a
      # caller cannot put its own address on the front of it.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - APP_ENV=${APP_ENV:-production}
      # /docs, /redoc and /openapi.json. Blank follows APP_ENV: off in
      # production, on everywhere else. Set true to publish them anyway.
      - DOCS_ENABLED=${DOCS_ENABLED:-}
      # Decides what "today" means. A container runs UTC, so an
      # organization that is not in UTC needs this or the dashboard is a
      # whole offset out. IANA name, not an offset.
      - ORG_TIMEZONE=${ORG_TIMEZONE:-UTC}
      # What the interface calls people and bookings. generic, campus or
      # hospital; labels only, never the schema and never the API. Served
      # to the client by GET /api/v1/config.
      - ORG_PROFILE=${ORG_PROFILE:-generic}
      - ORG_DOMAIN_MASK=${ORG_DOMAIN_MASK:-org.internal}
      - APP_CORS_ORIGINS=${APP_CORS_ORIGINS:-http://localhost}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CONTACT_EMAIL=${VAPID_CONTACT_EMAIL:-admin@org.internal}
      # Opt in, and only to a counter you run yourself. Both have to be
      # set: an empty endpoint leaves it off.
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - TELEMETRY_ENDPOINT=${TELEMETRY_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      chronos-db:
        condition: service_healthy
      chronos-cache:
        condition: service_started
    restart: always
    networks:
      - chronos_net

  chronos-db:
    image: postgres:17-alpine
    container_name: chronos_postgres_persistence
    environment:
      POSTGRES_USER: chronos_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureCloud2026}
      POSTGRES_DB: chronos_ledger
    volumes:
      - chronos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos_admin -d chronos_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - chronos_net

  chronos-cache:
    image: redis:7.4-alpine
    container_name: chronos_redis_state
    command: redis-server --appendonly yes
    volumes:
      - chronos_cache_store:/data
    restart: always
    networks:
      - chronos_net

volumes:
  chronos_data:
    driver: local
  chronos_cache_store:
    driver: local
  frontend_build:
    driver: local

networks:
  chronos_net:
    driver: bridge
