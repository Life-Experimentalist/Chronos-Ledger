#
# HTTPS listener. This file is NOT loaded directly: at container start,
# 40-tls.sh copies it into /etc/nginx/tls/ only when both certificate files
# exist under /etc/nginx/certs/, and nginx.conf includes /etc/nginx/tls/*.conf.
# Without certificates the glob matches nothing and only the :80 server runs,
# so the same image works with or without TLS.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/chronos-common.conf;
}
