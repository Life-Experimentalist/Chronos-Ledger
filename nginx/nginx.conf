events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream fastapi_backend {
        server chronos-app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers — defined at server block level so they apply to ALL
        # responses. Nginx does NOT inherit add_header from parent blocks when
        # a child block has its own add_header directives, so keep these here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # API proxy
        location /api/v1 {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # FastAPI docs (restrict to internal networks in production)
        location /docs {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://fastapi_backend;
        }

        # Service worker — must never be cached (stale SW = broken app)
        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            # Repeat security headers since this block has its own add_header
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Web manifest
        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Next.js static assets — content-hashed filenames, safe to cache forever
        location /_next/static/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # PWA icons
        location /icons/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # SPA fallback — all other paths serve index.html (client-side routing)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ $uri.html /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
