events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream fastapi_backend {
        server chronos-app:8000;
        keepalive 32;
    }

    # Send Connection: upgrade only when the client is actually upgrading,
    # so plain GETs through the /ws location stay ordinary HTTP.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HSTS must never be sent over plain HTTP (RFC 6797). The header value
    # is empty for http requests, and nginx drops add_header lines whose
    # value is empty, so only the :443 listener ever emits it.
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    # Both listeners share one body: chronos-common.conf carries the security
    # headers and every location block.
    server {
        listen 80;
        server_name _;
        include /etc/nginx/chronos-common.conf;
    }

    # 40-tls.sh copies tls-server.conf in here at container start when a
    # certificate pair is mounted; with no certificates the glob is empty
    # and Chronos serves HTTP only.
    include /etc/nginx/tls/*.conf;
}
