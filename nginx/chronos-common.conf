# Shared server-block body, included by both the HTTP (:80) listener in
# nginx.conf and the HTTPS (:443) listener in tls-server.conf, so the two
# can never drift apart.

# Security headers, defined at server block level so they apply to ALL
# responses. Nginx does NOT inherit add_header from parent blocks when
# a child block has its own add_header directives, so keep these here.
# $hsts_header is empty on plain HTTP (see the map in nginx.conf), and an
# add_header with an empty value emits nothing, so HSTS only ever leaves
# on HTTPS responses.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
add_header Strict-Transport-Security $hsts_header always;

# API proxy
location /api/v1 {
    proxy_pass http://fastapi_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}

# WebSocket proxy. The backend mounts realtime under /api/v1 like
# everything else, so the public /ws (what the frontend dials) is
# rewritten onto /api/v1/ws; /ws/stats follows the same mapping.
location /ws {
    proxy_pass http://fastapi_backend/api/v1/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
}

# FastAPI docs (restrict to internal networks in production)
location /docs {
    proxy_pass http://fastapi_backend;
    proxy_set_header Host $host;
}

location /redoc {
    proxy_pass http://fastapi_backend;
    proxy_set_header Host $host;
}

location /openapi.json {
    proxy_pass http://fastapi_backend;
    proxy_set_header Host $host;
}

location /health {
    proxy_pass http://fastapi_backend;
}

# Service worker, must never be cached (stale SW = broken app)
location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    # Repeat security headers since this block has its own add_header
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# Web manifest
location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# Next.js static assets, content-hashed filenames, safe to cache forever
location /_next/static/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# PWA icons
location /icons/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
}

# SPA fallback, all other paths serve index.html (client-side routing)
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ $uri.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts_header always;
}
