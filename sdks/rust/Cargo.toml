[package]
name = "chronosledger-client"
# release-please writes this line (release-please-config.json).
version = "0.18.0"
edition = "2021"
description = "Typed client for the Chronos Ledger REST API"
license = "Apache-2.0"
repository = "https://github.com/Life-Experimentalist/Chronos-Ledger"
homepage = "https://chronos.vkrishna04.me"
documentation = "https://docs.rs/chronosledger-client"
readme = "README.md"
keywords = ["chronos-ledger", "scheduling", "attendance", "api-client", "openapi"]
categories = ["api-bindings"]
rust-version = "1.88"
# build.rs generates the client from openapi.yaml on every build, so both files
# have to ship or the published crate cannot compile.
include = ["src/**", "build.rs", "openapi.yaml", "Cargo.toml", "Cargo.lock", "README.md"]

[dependencies]
# What the generated client needs.
progenitor-client = "=0.15.1"
reqwest = { version = "0.13.4", features = ["json", "query", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["serde", "v4"] }
regress = "0.12"
base64 = "0.23"
rand = "0.10"
futures = "0.3"
# What the hand-written layer needs.
http = "1"
httpdate = "1"
tokio = { version = "1", features = ["sync", "time"] }

[build-dependencies]
progenitor = { version = "=0.15.1", default-features = false }
prettyplease = "0.3.0"
quote = "1"
serde_json = "1"
serde_yaml = "0.9"
syn = "3.0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
