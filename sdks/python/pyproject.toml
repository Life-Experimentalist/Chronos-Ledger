[project]
name = "chronosledger-client"
version = "0.18.0"
description = "Typed client for the Chronos Ledger REST API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Chronos Ledger Contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "attrs>=23.1",
]

[project.urls]
Homepage = "https://chronos.vkrishna04.me"
Source = "https://github.com/Life-Experimentalist/Chronos-Ledger/tree/main/sdks/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronosledger_client"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 110
extend-exclude = ["src/chronosledger_client/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
