# Settings for openapi-python-client. See docs/sdks/python.md for the command.
project_name_override: chronos-ledger-client
package_name_override: generated
post_hooks:
  - "uvx ruff@0.16.8 check . --fix-only --extend-select=I"
  - "uvx ruff@0.16.8 format ."
# The export archive (GET /api/v1/admin/export) is a zip. Reading it as
# octet-stream makes the generated call return its bytes as a File.
content_type_overrides:
  application/zip: application/octet-stream
