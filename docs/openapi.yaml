openapi: "3.1.0"

# Copyright 2026 Chronos Ledger Contributors
# Licensed under the Apache License, Version 2.0
#
# This is the authoritative static OpenAPI contract for Chronos Ledger.
# FastAPI also generates a live version at runtime: GET /openapi.json
# The two should remain in sync. Update this file when adding or changing endpoints.

info:
  title: Chronos Ledger API
  version: "1.0.0"
  description: |
    Organization Schedule & Attendance Management REST API.

    **Authentication**: All endpoints except `/config` and `/auth/login`
    require a Bearer JWT in the `Authorization` header. The two kiosk
    endpoints, `/guest/register-checkin` and `/guest/directory`, accept an
    API key in `X-API-Key` instead, since a lobby terminal has no one to
    sign in.

    **Roles**: `SUPER_ADMIN` > `UNIT_ADMIN` > `STAFF` > `MEMBER`.
    Role requirements are noted on each endpoint.
  contact:
    name: Chronos Ledger Contributors
    email: admin@org.internal
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost/api/v1
    description: Local development (Docker Compose)
  - url: http://{server_ip}/api/v1
    description: Organization intranet
    variables:
      server_ip:
        default: "192.168.1.100"

# ─────────────────────────────────────────────
# Reusable components
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        A machine credential bound to a service-account user. Accepted anywhere
        a Bearer token is, and acts as the bound user, so roles and unit scoping
        apply unchanged. This is how a lobby kiosk authenticates.

  schemas:
    # ── Enumerations ──────────────────────────
    InstitutionalRole:
      type: string
      enum: [SUPER_ADMIN, UNIT_ADMIN, STAFF, MEMBER]
      description: Role assigned to a system user.

    AccessReadiness:
      type: string
      enum: [OPEN_AD_HOC, BUSY, CRITICAL_DO_NOT_DISTURB, VERY_FREE]
      description: Staff availability / occupancy index visible to members.

    DynamicState:
      type: string
      enum: [SCHEDULED, ON_LEAVE, PROXY_SUBSTITUTE, LUNCH, INTERNAL_MEETING, ADHOC_EVENT]
      description: Operational state of a daily ledger entry.

    ExecutionMode:
      type: string
      enum: [PHYSICAL, ONLINE_STREAM]
      description: Class delivery format.

    VerificationMetric:
      type: string
      enum: [PRESENT, ABSENT, LATE]
      description: Attendance marking status for a member.

    LogVerificationState:
      type: string
      enum: [PENDING_VERIFICATION, VERIFIED_APPROVED, VERIFIED_DENIED]
      description: Approval workflow state for absence requests and guest handshakes.

    # ── Auth ──────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: staff@org.internal
        password:
          type: string
          format: password
          example: "••••••••"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "Signed JWT. Include as `Authorization: Bearer <token>`."
        token_type:
          type: string
          example: bearer
        user_id:
          type: string
          example: FAC001
        role:
          $ref: "#/components/schemas/InstitutionalRole"
        full_name:
          type: string
          example: Dr. Priya Sharma
        initial_login_state:
          type: boolean
          description: True on first login, client should prompt password change.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    # ── Users ─────────────────────────────────
    UserCreate:
      type: object
      required: [id, full_name, email_address, password, role_type]
      properties:
        id:
          type: string
          example: FAC042
        full_name:
          type: string
          example: Dr. Rajan Mehta
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role_type:
          $ref: "#/components/schemas/InstitutionalRole"
        unit_code:
          type: string
          nullable: true
          example: CSE
        assigned_base_station:
          type: string
          nullable: true
          example: Staff Room Block A
        reporting_line_manager:
          type: string
          nullable: true
          example: HOD001

    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email_address:
          type: string
          format: email
          nullable: true
        unit_code:
          type: string
          nullable: true
        assigned_base_station:
          type: string
          nullable: true
        reporting_line_manager:
          type: string
          nullable: true

    ProvisionedCredential:
      type: object
      description: >
        A password generated for a member the import created. Returned
        only in the upload response and never stored.
      properties:
        member_id:
          type: string
        email_address:
          type: string
        initial_password:
          type: string
      required: [member_id, email_address, initial_password]

    CsvImportResult:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        rows_ingested:
          type: integer
          description: Present when status is SUCCESS.
        provisioned_credentials:
          type: array
          description: >
            One entry per member this import created, empty when the file
            only touched members who already existed. The single copy of
            these passwords: save them or reset the members individually.
          items:
            $ref: "#/components/schemas/ProvisionedCredential"
        error_log:
          type: string
          description: Present when status is FAILED.
      required: [status]

    PasswordResetResponse:
      type: object
      properties:
        user_id:
          type: string
        initial_password:
          type: string
          description: >
            Plain text, returned only here. Never stored and never logged.
      required: [user_id, initial_password]

    UserStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AccessReadiness"

    UserResponse:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        email_address:
          type: string
        role_type:
          $ref: "#/components/schemas/InstitutionalRole"
        unit_code:
          type: string
          nullable: true
        assigned_base_station:
          type: string
          nullable: true
        current_occupancy_index:
          $ref: "#/components/schemas/AccessReadiness"
        reporting_line_manager:
          type: string
          nullable: true

    # ── Schedule ──────────────────────────────
    PlanningCycleCreate:
      type: object
      required: [cycle_label, date_bounds_start, date_bounds_end]
      properties:
        cycle_label:
          type: string
          example: 2026-Fall-Trimester
        date_bounds_start:
          type: string
          format: date
          example: "2026-09-01"
        date_bounds_end:
          type: string
          format: date
          example: "2026-12-20"
        operational_status:
          type: boolean
          default: false

    PlanningCycleResponse:
      type: object
      properties:
        id:
          type: integer
        cycle_label:
          type: string
        date_bounds_start:
          type: string
          format: date
        date_bounds_end:
          type: string
          format: date
        operational_status:
          type: boolean

    DailyLedgerUpdate:
      type: object
      properties:
        operational_state:
          $ref: "#/components/schemas/DynamicState"
          nullable: true
        substitute_lead_id:
          type: string
          nullable: true
        delivery_format:
          $ref: "#/components/schemas/ExecutionMode"
          nullable: true
        virtual_connection_string:
          type: string
          nullable: true
          example: https://meet.google.com/xyz-abc
        latitude_target:
          type: number
          format: double
          nullable: true
        longitude_target:
          type: number
          format: double
          nullable: true
        altitude_target:
          type: number
          format: double
          nullable: true
        precision_radius_meters:
          type: integer
          nullable: true
          description: Geofence radius override for this specific session.

    DailyLedgerResponse:
      type: object
      properties:
        id:
          type: integer
        target_date:
          type: string
          format: date
        activity_id:
          type: integer
        active_lead_id:
          type: string
          nullable: true
        substitute_lead_id:
          type: string
          nullable: true
        target_room_identifier:
          type: string
        delivery_format:
          $ref: "#/components/schemas/ExecutionMode"
        virtual_connection_string:
          type: string
          nullable: true
        operational_state:
          $ref: "#/components/schemas/DynamicState"
        activity_code:
          type: string
          nullable: true
        activity_title:
          type: string
          nullable: true
        time_window_start:
          type: string
          format: time
          nullable: true
        time_window_end:
          type: string
          format: time
          nullable: true

    StaffLocationResponse:
      type: object
      properties:
        resolved_location:
          type: string
          description: Human-readable location label derived from 4-tier resolver.
          example: Room 204 (Active Class)
        status:
          type: string
          description: Redis override value if set, otherwise derived state.
        staff_id:
          type: string
        full_name:
          type: string
        occupancy_index:
          $ref: "#/components/schemas/AccessReadiness"

    # ── Attendance ────────────────────────────
    AttendanceMarkRequest:
      type: object
      required: [ledger_instance_id, member_id, marking_status]
      properties:
        ledger_instance_id:
          type: integer
          example: 1042
        member_id:
          type: string
          example: STU20210001
        marking_status:
          $ref: "#/components/schemas/VerificationMetric"
        user_lat:
          type: number
          format: double
          nullable: true
          example: 12.971598
        user_lon:
          type: number
          format: double
          nullable: true
          example: 77.594562
        user_alt:
          type: number
          format: double
          nullable: true
          example: 920.5
          description: Altitude in metres. Optional. The floor check runs only when the client supplies an altitude it can vouch for, and is skipped otherwise; a geo-fenced session requires lat/lon alone.

    AttendanceBatchRequest:
      type: object
      required: [ledger_instance_id, records]
      properties:
        ledger_instance_id:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceMarkRequest"

    AttendanceResponse:
      type: object
      properties:
        id:
          type: integer
        ledger_instance_id:
          type: integer
        member_id:
          type: string
        marking_status:
          $ref: "#/components/schemas/VerificationMetric"
        authorizing_agent_id:
          type: string
          nullable: true
          description: User ID of the person who marked attendance (may be staff for batch).
        modification_timestamp:
          type: string
          format: date-time

    ReverseRsvpCreate:
      type: object
      required: [target_absence_date, context_justification]
      properties:
        target_absence_date:
          type: string
          format: date
          example: "2026-06-15"
        context_justification:
          type: string
          minLength: 10
          example: Attending national staff development seminar.

    ReverseRsvpResponse:
      type: object
      properties:
        id:
          type: integer
        submitting_user_id:
          type: string
        target_absence_date:
          type: string
          format: date
        context_justification:
          type: string
        approval_state:
          $ref: "#/components/schemas/LogVerificationState"
        authorized_by_user_id:
          type: string
          nullable: true

    RsvpDecision:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/LogVerificationState"

    AnnotationCreate:
      type: object
      required: [ledger_instance_id, classification_tag, annotation_payload]
      properties:
        ledger_instance_id:
          type: integer
        classification_tag:
          type: string
          example: LATE_START
        annotation_payload:
          type: string
          example: Class started 10 minutes late due to lab setup.

    AnnotationResponse:
      type: object
      properties:
        id:
          type: integer
        ledger_instance_id:
          type: integer
        creator_id:
          type: string
        classification_tag:
          type: string
        annotation_payload:
          type: string
        distribution_timestamp:
          type: string
          format: date-time

    # ── Guest ─────────────────────────────────
    GuestCheckInRequest:
      type: object
      required: [guest_name, contact_phone, originating_body, target_staff_id, visitation_intent]
      properties:
        guest_name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Smith
        contact_phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: "^[-0-9+() ]+$"
          example: "+91 98765 43210"
        originating_body:
          type: string
          minLength: 2
          maxLength: 100
          example: TechCorp Ltd
        target_staff_id:
          type: string
          minLength: 1
          maxLength: 50
          example: FAC001
        visitation_intent:
          type: string
          minLength: 10
          maxLength: 500
          example: Research collaboration discussion

    GuestDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/LogVerificationState"

    GuestResponse:
      type: object
      properties:
        id:
          type: integer
        guest_name:
          type: string
        contact_phone:
          type: string
        originating_body:
          type: string
        target_staff_id:
          type: string
        visitation_intent:
          type: string
        handshake_status:
          $ref: "#/components/schemas/LogVerificationState"
        timestamp_marked:
          type: string
          format: date-time

    StaffAvailabilityResponse:
      type: object
      properties:
        staff_id:
          type: string
        full_name:
          type: string
        unit_code:
          type: string
          nullable: true
        availability_label:
          type: string
          description: Human-readable availability derived from current_occupancy_index.

    # ── Common ────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: Not authorized.

  responses:
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but insufficient role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation error (e.g. malformed request body).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

# Either credential is accepted on every endpoint below.
security:
  - BearerAuth: []
  - ApiKeyAuth: []

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Configuration ─────────────────────────
  /config:
    get:
      tags: [Configuration]
      summary: Deployment profile and display vocabulary
      description: |
        Public. Returns the deployment's `org_profile` (`generic`, `campus`,
        or `hospital`) and the display labels the UI should render for the
        neutral roles (staff, member, activity, unit, lead, cycle).
      security: []
      responses:
        "200":
          description: Deployment profile and labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  org_profile:
                    type: string
                    enum: [generic, campus, hospital]
                  labels:
                    type: object
                    properties:
                      staff: { type: string }
                      member: { type: string }
                      activity: { type: string }
                      unit: { type: string }
                      lead: { type: string }
                      cycle: { type: string }

  # ── Authentication ────────────────────────
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully.
        "400":
          description: Current password incorrect or new password too short.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ─────────────────────────────────
  /users/:
    get:
      tags: [Users]
      summary: List all users
      description: Requires `SUPER_ADMIN` or `UNIT_ADMIN`.
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/InstitutionalRole"
          description: Filter by role.
        - name: unit
          in: query
          schema:
            type: string
          description: Filter by unit code.
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a new user
      description: Requires `SUPER_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Duplicate user ID or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/staff/available:
    get:
      tags: [Users]
      summary: List staff with OPEN_AD_HOC or VERY_FREE status
      description: >
        Used by the Guest Kiosk to look up who can receive a visitor right now.
        This route **must** appear before `GET /users/{user_id}` in the router
        to prevent "staff" being matched as a user_id path parameter.
      security: []
      responses:
        "200":
          description: Available staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityResponse"

  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get a specific user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Users]
      summary: Update a user
      description: Admins can update any user. Users can update only themselves.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Users]
      summary: Delete a user
      description: Requires `SUPER_ADMIN`.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/reset-password:
    post:
      tags: [Users]
      summary: Issue a new password for a user who cannot sign in
      description: >
        The only route back into a locked-out account: change-password needs
        the password the user has lost, and no mail sender is configured.
        The new password is returned once and is never stored. The reset also
        drops every refresh token the user holds and rotates their calendar
        feed URL. A UNIT_ADMIN is limited to their own unit and may not reset
        an admin account.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A new password, shown this one time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/status:
    patch:
      tags: [Users]
      summary: Update staff availability status
      description: Staff update their own. Admins can update anyone.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Schedule ──────────────────────────────
  /schedule/ledger/today:
    get:
      tags: [Schedule]
      summary: Today's ledger entries for the authenticated user
      description: >
        Staff receive entries where they are the active or substitute lead.
        Members receive entries for their registered activities.
        Admins receive all entries.
      responses:
        "200":
          description: Today's schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLedgerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /schedule/ledger/{ledger_id}:
    get:
      tags: [Schedule]
      summary: Get a specific ledger entry
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLedgerResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Schedule]
      summary: Update a ledger entry
      description: Staff/Admin only. Used to set substitute, delivery format, or override geofence coords.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyLedgerUpdate"
      responses:
        "200":
          description: Updated ledger entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLedgerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedule/staff/{staff_id}/location:
    get:
      tags: [Schedule]
      summary: Resolve a staff member's current location via 4-tier resolver
      parameters:
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLocationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedule/staff/all/locations:
    get:
      tags: [Schedule]
      summary: Snapshot of all staff locations (Member Locator feed)
      responses:
        "200":
          description: All staff locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLocationResponse"

  /schedule/cycles:
    get:
      tags: [Schedule]
      summary: List planning cycles
      responses:
        "200":
          description: Cycle list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningCycleResponse"

    post:
      tags: [Schedule]
      summary: Create a new planning cycle
      description: Requires `SUPER_ADMIN` or `UNIT_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningCycleCreate"
      responses:
        "201":
          description: Cycle created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningCycleResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /schedule/cycles/{cycle_id}/close:
    patch:
      tags: [Schedule]
      summary: Close an active planning cycle
      description: Sets `operational_status = false`. Requires admin.
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningCycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedule/cycles/{source_cycle_id}/clone-to/{target_cycle_id}:
    post:
      tags: [Schedule]
      summary: Clone all activity offerings from one cycle to another
      description: >
        Copies `StructuralMasterSlot` and `Activity` records.
        Member enrollment and attendance records are **not** cloned.
        Re-import CSV after cloning to update enrollment.
      parameters:
        - name: source_cycle_id
          in: path
          required: true
          schema:
            type: integer
        - name: target_cycle_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clone complete. Returns count of cloned offerings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cloned_offerings:
                    type: integer

  # ── Attendance ────────────────────────────
  /attendance/mark:
    post:
      tags: [Attendance]
      summary: Mark single member attendance
      description: >
        Members may only mark themselves. Anyone else must be the ledger's
        assigned or substitute lead, or an admin, and a UNIT_ADMIN only within
        their own unit. Same rule as `/attendance/batch`.
        A ledger that carries `latitude_target` and `longitude_target` is
        geo-fenced: a member must send `user_lat` and `user_lon`, and the
        backend checks Haversine surface distance against
        `precision_radius_meters`. `user_alt` is optional and only adds a
        floor check when the ledger also carries an `altitude_target`.
        Omitting the coordinates on a fenced session returns 400; there is no
        client-side way to skip the fence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceMarkRequest"
      responses:
        "201":
          description: Attendance marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "400":
          description: Geofence violation or duplicate mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /attendance/batch:
    post:
      tags: [Attendance]
      summary: Batch mark attendance for multiple members
      description: Staff/Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatchRequest"
      responses:
        "200":
          description: Batch result summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked:
                    type: integer
                  skipped:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /attendance/ledger/{ledger_id}:
    get:
      tags: [Attendance]
      summary: Get all attendance records for a ledger entry
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/absence:
    post:
      tags: [Attendance]
      summary: Submit an absence request (Reverse RSVP)
      description: >
        Staff submit a request for a future absence.
        The request is routed to `reporting_line_manager` for approval.
        On approval, the relevant daily ledger entry transitions to `ON_LEAVE`
        and a WebSocket event is broadcast to the staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseRsvpCreate"
      responses:
        "201":
          description: Absence request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseRsvpResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /attendance/absence/pending:
    get:
      tags: [Attendance]
      summary: List absence requests pending the caller's approval
      description: Managers/Admins only. Returns requests where caller is the line manager.
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReverseRsvpResponse"

  /attendance/absence/{request_id}/decide:
    patch:
      tags: [Attendance]
      summary: Approve or deny an absence request
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpDecision"
      responses:
        "200":
          description: Decision recorded. If approved, ledger entry updated and WebSocket event fired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseRsvpResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance/annotations:
    post:
      tags: [Attendance]
      summary: Create a ledger annotation
      description: Staff/Admin only. Attach freeform notes (e.g. lab issues, late starts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationCreate"
      responses:
        "201":
          description: Annotation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"

  /attendance/annotations/{ledger_id}:
    get:
      tags: [Attendance]
      summary: Get all annotations for a ledger entry
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Annotations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationResponse"

  # ── Guest Gate ────────────────────────────
  /guest/register-checkin:
    post:
      tags: [Guest Gate]
      summary: Register an organization visitor (kiosk)
      description: >
        The visitor does not authenticate; the kiosk device does, with an
        admin-issued API key in `X-API-Key`.
        Fires a `GUEST_HANDSHAKE_REQ` WebSocket event to the target staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestCheckInRequest"
      responses:
        "201":
          description: Guest registered. Staff notified via WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        "404":
          description: Target staff not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /guest/directory:
    get:
      tags: [Guest Gate]
      summary: Staff availability directory (kiosk)
      description: >
        Returns staff with OPEN_AD_HOC or VERY_FREE status for kiosk display.
        Requires a credential: this response carries the staff roster and each
        person's live presence.
      parameters:
        - name: name
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: >
            Case-insensitive search by staff name. Two characters minimum, so
            the roster cannot be walked one letter at a time.
      responses:
        "200":
          description: Available staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityResponse"

  /guest/:
    get:
      tags: [Guest Gate]
      summary: List pending guest requests for authenticated staff
      description: Returns guests targeting the authenticated staff member with PENDING_VERIFICATION status.
      responses:
        "200":
          description: Pending guest requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestResponse"

  /guest/{transaction_id}/decide:
    patch:
      tags: [Guest Gate]
      summary: Accept or decline a guest visit
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDecisionRequest"
      responses:
        "200":
          description: Decision recorded. If approved, guest receives notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Ingestion ─────────────────────────────
  /ingestion/upload-csv:
    post:
      tags: [Ingestion]
      summary: Bulk import schedule from CSV
      description: >
        Requires `SUPER_ADMIN`. The matrix rewrites activities and
        registrations across every unit, so a unit-scoped admin cannot
        upload it.
        The CSV must contain these columns (case-sensitive):
        `member_id`, `member_name`, `member_email`, `activity_code`, `activity_title`,
        `unit`, `day_of_week_index` (0=Mon), `time_window_start` (HH:MM),
        `time_window_end` (HH:MM), `lead_id`, `room`.

        Creates/updates: Users, ActivityOfferings, StructuralMasterSlots, ActivityRegistrations.
        Idempotent, re-uploading the same CSV is safe: an existing member
        keeps their password.

        Each new member costs a bcrypt hash on the request thread, about
        half a second, so a file creating more than roughly 100 new
        members will exceed the 60s client and proxy timeouts. Split it.
      parameters:
        - name: cycle_id
          in: query
          required: true
          schema:
            type: integer
          description: Target planning cycle ID.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
        "400":
          description: CSV format error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ingestion/generate-ledger:
    post:
      tags: [Ingestion]
      summary: Trigger daily ledger generation
      description: >
        Requires admin. Generates `DailyLedger` rows from `StructuralMasterSlot`
        for a given date (defaults to tomorrow). Safe to re-run, existing rows are skipped.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target_date:
                  type: string
                  format: date
                  description: Date to generate. Defaults to tomorrow.
      responses:
        "200":
          description: Generation complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated:
                    type: integer
                  skipped:
                    type: integer
                  target_date:
                    type: string
                    format: date
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Calendar Sync ─────────────────────────
  /sync/user-feed/{user_id}.ics:
    get:
      tags: [Calendar Sync]
      summary: iCalendar feed for a user (rolling 37-day window)
      description: >
        Subscribe this URL directly in Google Calendar, Apple Calendar, or Outlook.
        Returns standard iCalendar (text/calendar) content.
        Staff feed includes all sessions where they are active or substitute lead.
        Member feed includes all registered activities.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: iCalendar feed.
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\nVERSION:2.0\n..."
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Health ────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      description: Used by Docker healthcheck. Returns 200 when the app is ready.
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

# ─────────────────────────────────────────────
# WebSocket (informational, not an HTTP path)
# ─────────────────────────────────────────────
# WebSocket endpoint: ws://<server>/ws?token=<jwt>
#
# Connect with the JWT as a query parameter. After the handshake the server
# registers the connection and begins routing domain events to this client.
#
# Inbound frames (server → client):
#
#   { "event": "ABSENCE_APPROVAL_REQUIRED",
#     "payload": { "log_id": 12, "from": "Prof. A", "date": "2026-06-15" } }
#
#   { "event": "ABSENCE_DECISION",
#     "payload": { "log_id": 12, "decision": "VERIFIED_APPROVED" } }
#
#   { "event": "GUEST_HANDSHAKE_REQ",
#     "payload": { "transaction_reference": 5, "guest_name": "J. Smith",
#                  "originating_body": "TechCorp", "intent": "..." } }
#
#   { "event": "LEDGER_STATE_CHANGE",
#     "payload": { "ledger_id": 1042, "new_state": "ON_LEAVE" } }
#
# The client sends no frames upstream (receive-only subscription model).
