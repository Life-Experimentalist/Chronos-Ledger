openapi: "3.1.0"

# Copyright 2026 Chronos Ledger Contributors
# Licensed under the Apache License, Version 2.0
#
# This is the authoritative static OpenAPI contract for Chronos Ledger.
# FastAPI also generates a live version at runtime: GET /openapi.json, but
# only where DOCS_ENABLED allows it, which it does not under APP_ENV=production.
# The two should remain in sync. Update this file when adding or changing endpoints.

info:
  title: Chronos Ledger API
  version: "0.10.0" # x-release-please-version
  description: |
    Organization Schedule & Attendance Management REST API.

    **Authentication**: All endpoints except `/config` and `/auth/login`
    require a Bearer JWT in the `Authorization` header. An API key in
    `X-API-Key` is accepted in place of one anywhere, which is how a lobby
    terminal with no one to sign in reaches `/guest/register-checkin` and
    `/guest/directory`. A key can be narrowed to part of the API and given
    an end date: see the `ApiKeyAuth` security scheme.

    **Roles**: `SUPER_ADMIN` > `UNIT_ADMIN` > `STAFF` > `MEMBER`.
    Role requirements are noted on each endpoint.
  contact:
    name: Chronos Ledger Contributors
    email: admin@org.internal
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost
    description: Local development (Docker Compose)
  - url: http://{server_ip}
    description: Organization intranet
    variables:
      server_ip:
        default: "192.168.1.100"

# ─────────────────────────────────────────────
# Reusable components
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A machine credential bound to a service-account user. Accepted anywhere
        a Bearer token is, and acts as the bound user, so roles and unit scoping
        apply unchanged. This is how a lobby kiosk authenticates.

        A key can also be narrowed and given an end date, which a Bearer token
        cannot be. `scopes` is a comma separated list of `<area>:read` and
        `<area>:write`, where the area is the path segment after `/api/v1`:
        `schedule`, `resources`, `attendance`, `users`, `ingestion`, `guest`,
        `sync`, `config`, `auth`, `api-keys`. `GET`, `HEAD` and `OPTIONS` are
        reads and everything else is a write, so `schedule:read` passes
        `GET /schedule/slots` and is refused `POST /schedule/slots` with a 403
        naming `schedule:write`. The single scope `*` is every area, which is
        what a key issued before scopes existed holds and what a key created
        without naming any gets.

        `expires_at` is checked on the request, not by a sweep, so a key stops
        working the moment it runs out and answers 401 `API key expired`. A
        null expiry never runs out.

        The first-login gate does not apply to a key. It holds an admin
        account until the password it was handed is changed, and a key never
        uses that password, so a service account at an admin role works
        through its key without anyone signing in as it.

  schemas:
    # ── Enumerations ──────────────────────────
    InstitutionalRole:
      type: string
      enum: [SUPER_ADMIN, UNIT_ADMIN, STAFF, MEMBER]
      description: Role assigned to a system user.

    AccessReadiness:
      type: string
      enum: [OPEN_AD_HOC, BUSY, CRITICAL_DO_NOT_DISTURB, VERY_FREE]
      description: Staff availability / occupancy index visible to members.

    DynamicState:
      type: string
      enum: [SCHEDULED, ON_LEAVE, PROXY_SUBSTITUTE, LUNCH, INTERNAL_MEETING, ADHOC_EVENT]
      description: Operational state of a daily ledger entry.

    ExecutionMode:
      type: string
      enum: [PHYSICAL, ONLINE_STREAM]
      description: Class delivery format.

    VerificationMetric:
      type: string
      enum: [PRESENT, ABSENT, LATE]
      description: Attendance marking status for a member.

    LogVerificationState:
      type: string
      enum: [PENDING_VERIFICATION, VERIFIED_APPROVED, VERIFIED_DENIED]
      description: Approval workflow state for absence requests and guest handshakes.

    # ── Auth ──────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: staff@org.internal
        password:
          type: string
          format: password
          example: "••••••••"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "Signed JWT. Include as `Authorization: Bearer <token>`."
        token_type:
          type: string
          example: bearer
        user_id:
          type: string
          example: FAC001
        role:
          $ref: "#/components/schemas/InstitutionalRole"
        full_name:
          type: string
          example: Dr. Priya Sharma
        initial_login_state:
          type: boolean
          description: True on first login, client should prompt password change.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 12
          description: >
            At least PASSWORD_MIN_LENGTH characters, 12 unless the deployment
            has raised it, and not a placeholder published in this repository.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    FeedToken:
      type: object
      properties:
        feed_token:
          type: string
          description: 256 bits out of the system random source, hex encoded.
        feed_path:
          type: string
          description: >
            The feed path this token opens, relative to the server root.
          example: /api/v1/sync/user-feed/1f4a9c2e.ics

    # ── Users ─────────────────────────────────
    UserCreate:
      type: object
      required: [id, full_name, email_address, password, role_type]
      properties:
        id:
          type: string
          example: FAC042
        full_name:
          type: string
          example: Dr. Rajan Mehta
        email_address:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          description: >
            Held to the same PASSWORD_MIN_LENGTH floor as a password the user
            chooses for themselves.
        role_type:
          $ref: "#/components/schemas/InstitutionalRole"
        unit_code:
          type: string
          nullable: true
          example: CSE
        assigned_base_station:
          type: string
          nullable: true
          example: Front Desk
        reporting_line_manager:
          type: string
          nullable: true
          example: HOD001

    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email_address:
          type: string
          format: email
          nullable: true
        unit_code:
          type: string
          nullable: true
        assigned_base_station:
          type: string
          nullable: true
        reporting_line_manager:
          type: string
          nullable: true

    ProvisionedCredential:
      type: object
      description: >
        A password generated for a member the import created. Returned
        only in the upload response and never stored.
      properties:
        member_id:
          type: string
        email_address:
          type: string
        initial_password:
          type: string
      required: [member_id, email_address, initial_password]

    CsvImportResult:
      type: object
      properties:
        status:
          type: string
          enum: [SUCCESS, FAILED]
        rows_ingested:
          type: integer
          description: Present when status is SUCCESS.
        provisioned_credentials:
          type: array
          description: >
            One entry per member this import created, empty when the file
            only touched members who already existed. The single copy of
            these passwords: save them or reset the members individually.
          items:
            $ref: "#/components/schemas/ProvisionedCredential"
        slots_corrected:
          type: integer
          description: >
            Slots this file changed rather than created. Re-uploading a file
            with a corrected room or lead is how a timetable is edited in
            bulk; a slot whose start time moved does not match and arrives as
            a second slot instead, with the original reported in not_in_file.
        ledger_rows_updated:
          type: integer
          description: >
            Days already generated from a corrected slot that were still
            plans and now carry the new lead and room. A day whose room
            changed also has its geofence cleared, because the old one
            fenced members out of the room they have just been sent to.
        ledger_rows_kept:
          type: integer
          description: >
            Days left alone because attendance or a note has been recorded
            against them. They now disagree with the timetable on purpose:
            they record what happened. Days already past are never touched
            and are not counted here.
        not_in_file:
          $ref: "#/components/schemas/ImportOrphans"
        error_log:
          type: string
          description: Present when status is FAILED.
      required: [status]

    ImportOrphans:
      type: object
      description: >
        What the cycle holds that this file did not mention. A report and
        never an action: a file covering half a timetable cannot be told
        apart from a timetable that lost half its classes, so nothing here
        is removed and somebody decides.


        Scoped to the units named in the file, not to the whole cycle, so a
        file covering one unit does not report every class in every other
        unit each time it is uploaded.
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/OrphanSlot"
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/OrphanEnrollment"
      required: [slots, enrollments]

    OrphanSlot:
      type: object
      properties:
        id:
          type: integer
          description: What DELETE /schedule/slots/{slot_id} takes, if it should go.
        activity_code:
          type: string
        day_of_week_index:
          type: integer
        time_window_start:
          type: string
          format: time
        room:
          type: string
          nullable: true
      required: [id, activity_code, day_of_week_index, time_window_start]

    OrphanEnrollment:
      type: object
      properties:
        member_id:
          type: string
        activity_code:
          type: string
      required: [member_id, activity_code]

    PasswordResetResponse:
      type: object
      properties:
        user_id:
          type: string
        initial_password:
          type: string
          description: >
            Plain text, returned only here. Never stored and never logged.
      required: [user_id, initial_password]

    UserStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AccessReadiness"

    UserResponse:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        email_address:
          type: string
        role_type:
          $ref: "#/components/schemas/InstitutionalRole"
        unit_code:
          type: string
          nullable: true
        assigned_base_station:
          type: string
          nullable: true
        current_occupancy_index:
          $ref: "#/components/schemas/AccessReadiness"
        reporting_line_manager:
          type: string
          nullable: true

    # ── API keys ─────────────────────────────
    ApiKeyCreate:
      type: object
      required: [label, user_id]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: What this key is for, so it can be recognised in the list.
          example: PulseWard HMS
        user_id:
          type: string
          description: >
            The user this key acts as. The key can never do more than that
            user can, whatever its scopes say.
          example: SVC001
        scopes:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            pattern: "^(\\*|[a-z][a-z-]*:(read|write))$"
          description: >
            Areas this key may reach. Omit the field for an unrestricted key;
            an empty array is refused, since a key that can reach nothing is
            not a key anybody wants. Stored sorted and deduplicated.
          example: [schedule:read, resources:read]
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the key stops working. Omit for a key that never does. A time
            already past is refused at creation.
          example: "2027-01-01T00:00:00Z"

    ApiKeyResponse:
      type: object
      properties:
        id:
          type: integer
        key_prefix:
          type: string
          description: The first 12 characters, enough to tell two keys apart.
          example: ck_8Kd2mQ7x
        label:
          type: string
        user_id:
          type: string
        scopes:
          type: string
          description: Comma separated, or `*` for a key that was never narrowed.
          example: resources:read,schedule:read
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyResponse"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: >
                The raw key. Returned exactly once, here. Only its hash is
                stored, so it cannot be shown again and a lost key has to be
                revoked and reissued.
              example: ck_8Kd2mQ7xR3nL9vB5tY1wZ0aC6eF4gH2jK8mN

    # ── Resources ─────────────────────────────
    ResourceResponse:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          description: The importer's match key. Not editable.
          example: LH-3
        label:
          type: string
          example: Lecture Hall 3
        resource_type:
          type: string
          enum: [ROOM, PERSON]
        unit_code:
          type: string
          nullable: true
        capacity:
          type: integer
          nullable: true
        user_id:
          type: string
          nullable: true
          description: Set when this resource is a person.
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        altitude_target:
          type: number
          nullable: true
        active:
          type: boolean

    ResourceCreate:
      type: object
      required: [code]
      description: >
        A room. Every string is trimmed first, code included, the same as
        the importer trims a room name, so this room and the same name in a
        later CSV are one row.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            The importer's match key, unique across every resource. Not
            editable afterwards.
          example: LH-3
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Defaults to the code, which is what an imported room gets.
          example: Lecture Hall 3
        unit_code:
          type: string
          maxLength: 50
          nullable: true
        capacity:
          type: integer
          minimum: 0
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
          description: Set together with longitude, or not at all.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        altitude_target:
          type: number
          nullable: true

    ResourceUpdate:
      type: object
      description: >
        Every field is optional and a field left out is left alone. code,
        resource_type and user_id are absent on purpose: code is the importer's
        match key, and a room that becomes a person is a different resource,
        not an edit.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
        capacity:
          type: integer
          minimum: 0
          nullable: true
        latitude:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
          description: >
            Set or cleared together with longitude. Setting the pair is what
            switches geofencing on for sessions held here.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        altitude_target:
          type: number
          nullable: true
          description: Optional. Without it the fence is horizontal only.
        active:
          type: boolean

    BusyInterval:
      type: object
      description: >
        One window in which a resource is taken, by a weekly slot or by a
        reservation. Which kind it is can be read off the fields that are
        filled in: a slot carries the activity fields and a null
        reservation_id, and a reservation carries the reverse. What a booking
        is for is deliberately not here, because this is readable by anyone
        signed in.


        The date is the day the window opened on and end_date the day it
        finishes on. They differ when the window ran past midnight, and
        then the date can fall before the range that returned the
        interval: a booking dated Monday from 22:00 to 06:00 is on
        Tuesday's calendar.


        A generated day is a third kind and reads as a slot: it carries the
        activity fields and a null reservation_id, and its master_slot_id is
        the slot it came from, or null if that slot has since been deleted.
        Telling a day apart from the weekly slot that produced it is not
        possible from these fields alone and is not meant to be. What refused
        the request is in the message beside the list.
      properties:
        date:
          type: string
          format: date
          example: "2026-01-05"
        start:
          type: string
          format: time
          example: "09:00:00"
        end_date:
          type: string
          format: date
          description: >
            Always present, and the same as date for a window that
            finishes on the day it started. It is spelled out rather than
            left to be inferred, because inferring it wrong is silent: a
            reader that takes date with end and ignores this computes
            minus sixteen hours for a night shift running 22:00 to 06:00,
            and a plausible answer for every interval written before
            overnight windows existed.
          example: "2026-01-05"
        end:
          type: string
          format: time
          example: "10:00:00"
        activity_id:
          type: integer
          nullable: true
        activity_code:
          type: string
          nullable: true
        master_slot_id:
          type: integer
          nullable: true
        reservation_id:
          type: integer
          nullable: true

    AvailabilityResponse:
      type: object
      properties:
        resource_id:
          type: integer
        code:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        busy:
          type: array
          description: >
            Busy intervals, not free ones. Times are naive wall clock in the
            organisation's own timezone, with no offset and no Z.
          items:
            $ref: "#/components/schemas/BusyInterval"

    ReservationCreate:
      type: object
      required: [date, start, end, purpose]
      properties:
        date:
          type: string
          format: date
          description: >
            The day the window opens on. A window that runs past midnight
            finishes on the day after this one.
          example: "2026-01-06"
        start:
          type: string
          format: time
          example: "14:00"
        end:
          type: string
          format: time
          description: >
            Earlier than the start means the window runs past midnight and
            finishes on the day after `date`: 22:00 to 06:00 is an eight
            hour night shift. Equal to the start is refused, because 09:00
            to 09:00 is either nothing at all or a full day and there is no
            way to tell which was meant.
          example: "15:00"
        purpose:
          type: string
          minLength: 1
          maxLength: 200
          example: Ward round

    ReservationResponse:
      type: object
      properties:
        id:
          type: integer
        resource_id:
          type: integer
        resource_code:
          type: string
        date:
          type: string
          format: date
        start:
          type: string
          format: time
        end:
          type: string
          format: time
        purpose:
          type: string
          description: >
            Returned only to the caller that made the booking. It is not on
            the availability calendar, which anyone signed in can read.
        status:
          type: string
          enum: [HELD, CANCELLED]
        requested_by_id:
          type: string
          nullable: true
          description: >
            Null once the account that booked it has been deleted. A hold
            outlives the service account that placed it.
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
          nullable: true

    ReservationConflict:
      type: object
      description: >
        The body of a 409. What the booking ran into, not merely that it ran
        into something, so a caller can pick its next hour without asking
        availability again and diffing the answers. Nested under detail like
        every other error here, so one error handler reads them all.
      properties:
        detail:
          type: object
          properties:
            message:
              type: string
              example: the resource is already taken for part of that window
            conflicts:
              type: array
              items:
                $ref: "#/components/schemas/BusyInterval"

    # ── Schedule ──────────────────────────────
    CycleActivationConflict:
      type: object
      description: >
        The body of the 409 that refuses to open a planning cycle. Every clash
        across every slot in the cycle, listed at once rather than one per
        attempt, because an admin opening a hundred slots should not have to
        make a hundred attempts to see the list.


        Each entry is a BusyInterval naming what was already there, plus
        blocked_slot_id naming which of the cycle's own slots wanted it. A
        pair of the cycle's own slots is listed twice, once from each side,
        because neither of the two is the one at fault.
      properties:
        detail:
          type: object
          properties:
            message:
              type: string
              example: opening this cycle would put its slots on rooms already taken
            conflicts:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/BusyInterval"
                  - type: object
                    required: [blocked_slot_id]
                    properties:
                      blocked_slot_id:
                        type: integer
                        description: >
                          The slot in the cycle being opened that this
                          interval stands against.
                        example: 88

    PlanningCycleCreate:
      type: object
      required: [cycle_label, date_bounds_start, date_bounds_end]
      properties:
        cycle_label:
          type: string
          example: 2026-Fall-Trimester
        date_bounds_start:
          type: string
          format: date
          example: "2026-09-01"
        date_bounds_end:
          type: string
          format: date
          example: "2026-12-20"
        operational_status:
          type: boolean
          default: false

    PlanningCycleResponse:
      type: object
      properties:
        id:
          type: integer
        cycle_label:
          type: string
        date_bounds_start:
          type: string
          format: date
        date_bounds_end:
          type: string
          format: date
        operational_status:
          type: boolean

    MasterSlotCreate:
      type: object
      required:
        [
          day_of_week_index,
          time_window_start,
          time_window_end,
          activity_id,
          target_room_identifier,
        ]
      properties:
        day_of_week_index:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 = Monday through 7 = Sunday.
        time_window_start:
          type: string
          format: time
          example: "09:00:00"
        time_window_end:
          type: string
          format: time
          description: >
            Earlier than the start means the window runs past midnight and
            finishes on the day after the one the slot lands on: 22:00 to
            06:00 is an eight hour night shift. Equal to the start is
            refused, because 09:00 to 09:00 is either nothing at all or a
            full day and there is no way to tell which was meant.
          example: "10:00:00"
        activity_id:
          type: integer
        primary_lead_id:
          type: string
          nullable: true
        target_room_identifier:
          type: string
          description: >
            The room's name. Resolved to a resource, creating one on first
            sight, so a room does not have to be registered before a
            timetable can name it. Surrounding spaces are stripped.
          example: LH-201

    MasterSlotUpdate:
      type: object
      description: >
        Every field is optional and only the fields present are changed.
        activity_id is absent on purpose: every day the slot has produced
        carries its own copy of the activity, so pointing the slot at
        another one is a delete and a create, not an edit.
      properties:
        day_of_week_index:
          type: integer
          minimum: 1
          maximum: 7
        time_window_start:
          type: string
          format: time
        time_window_end:
          type: string
          format: time
        primary_lead_id:
          type: string
          nullable: true
        target_room_identifier:
          type: string

    MasterSlotResponse:
      type: object
      properties:
        id:
          type: integer
        day_of_week_index:
          type: integer
        time_window_start:
          type: string
          format: time
        time_window_end:
          type: string
          format: time
        activity_id:
          type: integer
        primary_lead_id:
          type: string
          nullable: true
        resource_id:
          type: integer
          nullable: true
          description: Prefer this over target_room_identifier.
        target_room_identifier:
          type: string
          nullable: true
          description: The room's name, mirrored from the resource. Being retired.

    SlotUpdateResult:
      type: object
      properties:
        ledger_rows_updated:
          type: integer
          description: Days that were still plans and now carry the new lead or room.
        ledger_rows_kept:
          type: integer
          description: >
            Days left as they were because attendance or a note has been
            recorded against them. They now disagree with the timetable, and
            that is deliberate: they record what happened.
        ledger_rows_removed:
          type: integer
          description: >
            Days withdrawn because the slot moved to another weekday and they
            sit on the old one. Zero for every other change.

    SlotDeletionResult:
      type: object
      properties:
        ledger_rows_removed:
          type: integer
          description: Days from today onward, which were still only plans.
        ledger_rows_detached:
          type: integer
          description: >
            Days already past. They keep their room, lead, window and
            attendance, and their master_slot_id becomes null.

    DailyLedgerUpdate:
      type: object
      properties:
        operational_state:
          $ref: "#/components/schemas/DynamicState"
          nullable: true
        substitute_lead_id:
          type: string
          nullable: true
        delivery_format:
          $ref: "#/components/schemas/ExecutionMode"
          nullable: true
        virtual_connection_string:
          type: string
          nullable: true
          example: https://meet.google.com/xyz-abc
        latitude_target:
          type: number
          format: double
          nullable: true
        longitude_target:
          type: number
          format: double
          nullable: true
        altitude_target:
          type: number
          format: double
          nullable: true
        precision_radius_meters:
          type: integer
          nullable: true
          description: Geofence radius override for this specific session.

    DailyLedgerResponse:
      type: object
      properties:
        id:
          type: integer
        target_date:
          type: string
          format: date
        activity_id:
          type: integer
        active_lead_id:
          type: string
          nullable: true
        substitute_lead_id:
          type: string
          nullable: true
        resource_id:
          type: integer
          nullable: true
          description: The room this is booked in. Prefer this over target_room_identifier.
        target_room_identifier:
          type: string
          nullable: true
          description: The room's name, mirrored from the resource. Being retired.
        delivery_format:
          $ref: "#/components/schemas/ExecutionMode"
        virtual_connection_string:
          type: string
          nullable: true
        operational_state:
          $ref: "#/components/schemas/DynamicState"
        activity_code:
          type: string
          nullable: true
        activity_title:
          type: string
          nullable: true
        time_window_start:
          type: string
          format: time
          nullable: true
          description: >
            The day's own window, copied off the slot when the day was
            generated rather than read back through it. Editing a slot moves
            the days it has still to run and leaves the ones that already
            happened saying the hour they happened at; deleting a slot leaves
            them saying it too. Null on an ad-hoc day, which never claimed an
            hour, and on a day generated before the ledger carried a window.
        time_window_end:
          type: string
          format: time
          nullable: true
          description: >
            Earlier than time_window_start means the day finishes on the date
            after target_date. A reader that ignores that computes minus
            sixteen hours for a night shift running 22:00 to 06:00.

    StaffLocationResponse:
      type: object
      properties:
        resolved_location:
          type: string
          description: Human-readable location label derived from 4-tier resolver.
          example: Room 204 (Active Class)
        status:
          type: string
          description: Redis override value if set, otherwise derived state.
        staff_id:
          type: string
        full_name:
          type: string
        occupancy_index:
          $ref: "#/components/schemas/AccessReadiness"

    # ── Attendance ────────────────────────────
    AttendanceMarkRequest:
      type: object
      required: [ledger_instance_id, member_id, marking_status]
      properties:
        ledger_instance_id:
          type: integer
          example: 1042
        member_id:
          type: string
          example: STU20210001
        marking_status:
          $ref: "#/components/schemas/VerificationMetric"
        user_lat:
          type: number
          format: double
          nullable: true
          example: 12.971598
        user_lon:
          type: number
          format: double
          nullable: true
          example: 77.594562
        user_alt:
          type: number
          format: double
          nullable: true
          example: 920.5
          description: Altitude in metres. Optional. The floor check runs only when the client supplies an altitude it can vouch for, and is skipped otherwise; a geo-fenced session requires lat/lon alone.

    AttendanceBatchRequest:
      type: object
      required: [ledger_instance_id, records]
      properties:
        ledger_instance_id:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceMarkRequest"

    AttendanceResponse:
      type: object
      properties:
        id:
          type: integer
        ledger_instance_id:
          type: integer
        member_id:
          type: string
        marking_status:
          $ref: "#/components/schemas/VerificationMetric"
        authorizing_agent_id:
          type: string
          nullable: true
          description: User ID of the person who marked attendance (may be staff for batch).
        modification_timestamp:
          type: string
          format: date-time

    ReverseRsvpCreate:
      type: object
      required: [target_absence_date, context_justification]
      properties:
        target_absence_date:
          type: string
          format: date
          example: "2026-06-15"
        context_justification:
          type: string
          minLength: 10
          example: Attending national staff development seminar.

    ReverseRsvpResponse:
      type: object
      properties:
        id:
          type: integer
        submitting_user_id:
          type: string
        target_absence_date:
          type: string
          format: date
        context_justification:
          type: string
        approval_state:
          $ref: "#/components/schemas/LogVerificationState"
        authorized_by_user_id:
          type: string
          nullable: true

    RsvpDecision:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/LogVerificationState"

    AnnotationCreate:
      type: object
      required: [ledger_instance_id, classification_tag, annotation_payload]
      properties:
        ledger_instance_id:
          type: integer
        classification_tag:
          type: string
          minLength: 1
          maxLength: 30
          description: >
            Free text, not a fixed vocabulary. Bounded because the column is
            a VARCHAR(30).
          example: LATE_START
        annotation_payload:
          type: string
          minLength: 1
          maxLength: 4000
          example: Class started 10 minutes late due to lab setup.

    AnnotationResponse:
      type: object
      properties:
        id:
          type: integer
        ledger_instance_id:
          type: integer
        creator_id:
          type: string
        classification_tag:
          type: string
        annotation_payload:
          type: string
        distribution_timestamp:
          type: string
          format: date-time

    # ── Guest ─────────────────────────────────
    GuestCheckInRequest:
      type: object
      required: [guest_name, contact_phone, originating_body, target_staff_id, visitation_intent]
      properties:
        guest_name:
          type: string
          minLength: 2
          maxLength: 100
          example: John Smith
        contact_phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: "^[-0-9+() ]+$"
          example: "+91 98765 43210"
        originating_body:
          type: string
          minLength: 2
          maxLength: 100
          example: TechCorp Ltd
        target_staff_id:
          type: string
          minLength: 1
          maxLength: 50
          example: FAC001
        visitation_intent:
          type: string
          minLength: 10
          maxLength: 500
          example: Research collaboration discussion

    GuestDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/LogVerificationState"

    GuestResponse:
      type: object
      properties:
        id:
          type: integer
        guest_name:
          type: string
        contact_phone:
          type: string
        originating_body:
          type: string
        target_staff_id:
          type: string
        visitation_intent:
          type: string
        handshake_status:
          $ref: "#/components/schemas/LogVerificationState"
        timestamp_marked:
          type: string
          format: date-time

    StaffAvailabilityResponse:
      type: object
      properties:
        staff_id:
          type: string
        full_name:
          type: string
        unit_code:
          type: string
          nullable: true
        availability_label:
          type: string
          description: Human-readable availability derived from current_occupancy_index.

    # ── Common ────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: Not authorized.

  responses:
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but insufficient role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation error (e.g. malformed request body).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >
        The request would destroy or contradict a record. The detail names
        the dates that stand in the way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >
        The caller is past its budget for this route. Sized by the
        RATE_LIMIT_* settings; the counters live in Redis, and an instance
        that cannot reach Redis stops applying the limits rather than
        refusing the requests.
      headers:
        Retry-After:
          description: Seconds until the budget refills.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

# Either credential is accepted on every endpoint below.
security:
  - BearerAuth: []
  - ApiKeyAuth: []

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Configuration ─────────────────────────
  /api/v1/config:
    get:
      tags: [Configuration]
      summary: Display vocabulary and password floor
      description: |
        Public. Returns the display labels the UI should render for the
        engine's six neutral nouns (staff, member, activity, unit, lead,
        cycle) and the shortest password this deployment accepts. The client
        needs both before anyone has logged in.

        Each label is set on its own with `LABEL_STAFF`, `LABEL_MEMBER`,
        `LABEL_ACTIVITY`, `LABEL_UNIT`, `LABEL_LEAD` or `LABEL_CYCLE`, and
        anything left blank comes back as the engine's own word: `Staff`,
        `Member`, `Activity`, `Unit`, `Lead`, `Cycle`. There is no domain
        preset behind them. Labels are display only: no field name in this
        document changes with them.
      security: []
      responses:
        "200":
          description: Display labels and the password floor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: object
                    properties:
                      staff: { type: string }
                      member: { type: string }
                      activity: { type: string }
                      unit: { type: string }
                      lead: { type: string }
                      cycle: { type: string }
                  password_min_length:
                    type: integer
                    minimum: 8
                    example: 12
                    description: >-
                      PASSWORD_MIN_LENGTH on this deployment. The onboarding
                      wizard states it in a placeholder and refuses a shorter
                      password before sending it.

  # ── Authentication ────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new access token
      description: >
        A refresh token works exactly once. The response carries its
        replacement, so a client that loses the response signs in again. A
        used token presented again more than ten seconds after its use ends
        every token descended from the same sign-in, on the reading that two
        parties hold it; inside those ten seconds it is refused and nothing
        else changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new access token and a replacement refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: >
            The token is unknown, already used, expired, or belongs to an
            account that no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      description: >
        Deletes the refresh token named in the body along with the used tokens
        it replaced, which ends that sign-in. An unknown token is not an
        error, so a client that has already lost its token can call this
        without handling a failure. The access token keeps working until it
        expires: there is no server-side revocation of access tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token revoked, or it was already gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: >
            Password changed. Every existing session is revoked and the
            calendar feed token is rotated. `refresh_token` replaces the one
            the caller holds; without storing it the caller is signed out when
            its access token expires.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully.
                  refresh_token:
                    type: string
        "400":
          description: >
            Current password incorrect, or the new password is the one the
            account already has. A password that breaks the length or
            placeholder rule is a 422 instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ─────────────────────────────────
  /api/v1/users/:
    get:
      tags: [Users]
      summary: List all users
      description: Requires `SUPER_ADMIN` or `UNIT_ADMIN`.
      parameters:
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/InstitutionalRole"
          description: Filter by role.
        - name: unit
          in: query
          schema:
            type: string
          description: Filter by unit code.
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a new user
      description: Requires `SUPER_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Duplicate user ID or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/staff/available:
    get:
      tags: [Users]
      summary: List staff with OPEN_AD_HOC or VERY_FREE status
      description: >
        Used by the Guest Kiosk to look up who can receive a visitor right now.
        This route **must** appear before `GET /users/{user_id}` in the router
        to prevent "staff" being matched as a user_id path parameter.
      security: []
      responses:
        "200":
          description: Available staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityResponse"

  /api/v1/users/{user_id}:
    get:
      tags: [Users]
      summary: Get a specific user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Users]
      summary: Update a user
      description: >
        Requires `SUPER_ADMIN` or `UNIT_ADMIN`, and a unit admin only within
        their own unit. Only a super-admin can modify an account that is itself
        an admin. A user cannot update their own record here.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{user_id}/reset-password:
    post:
      tags: [Users]
      summary: Issue a new password for a user who cannot sign in
      description: >
        The only route back into a locked-out account: change-password needs
        the password the user has lost, and no mail sender is configured.
        The new password is returned once and is never stored. The reset also
        drops every refresh token the user holds and rotates their calendar
        feed URL. A UNIT_ADMIN is limited to their own unit and may not reset
        an admin account.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A new password, shown this one time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{user_id}/status:
    put:
      tags: [Users]
      summary: Update staff availability status
      description: Staff update their own. A super-admin can update anyone.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── API keys ─────────────────────────────
  /api/v1/api-keys/:
    get:
      tags: [API Keys]
      summary: List issued keys
      description: >
        Requires `SUPER_ADMIN`. Shows what each key is scoped to and when it
        runs out, which is how an unrestricted key left over from before
        scopes existed becomes visible.
      responses:
        "200":
          description: Every key, without its secret.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [API Keys]
      summary: Issue a key
      description: >
        Requires `SUPER_ADMIN`. The raw key is in the response and nowhere
        else. Bind it to a service account rather than to a person: the key
        acts as that user, so a person's key inherits everything they can do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: Key issued. The `api_key` field will not be shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such user to bind the key to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            A scope that is not a scope, an empty scope list, or an
            `expires_at` already in the past.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Revoke a key
      description: >
        Requires `SUPER_ADMIN`. Takes effect on the next request that uses it.
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Resources ─────────────────────────────
  /api/v1/resources/:
    get:
      tags: [Resources]
      summary: List resources
      description: >
        Every room, person and piece of equipment the schedule can point at.
        Readable by anyone signed in: an external system that has to book a
        room needs to be able to find it first.
      parameters:
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            enum: [ROOM, PERSON]
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Resources, ordered by code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Resources]
      summary: Create a room
      description: >
        Requires `SUPER_ADMIN`. Registers a room before any timetable names
        it, for a system that manages its own rooms. The row is the one an
        import would have made, so a later CSV naming the room finds it
        rather than creating a second. A retry after a lost response reads
        the room back with `GET /api/v1/resources/?code=`: the code already
        identifies it, so no Idempotency-Key is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreate"
      responses:
        "201":
          description: The room as created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A resource with that code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            A blank or over-long code, latitude without longitude or the
            reverse, or a coordinate out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/resources/{resource_id}:
    parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Resources]
      summary: Update a resource
      description: >
        Fill in what a CSV could not know: capacity, and where the room
        physically is. Setting latitude and longitude is what switches
        geofencing on for every session held there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: The resource as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            latitude and longitude were not set or cleared together, or a
            coordinate was out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/resources/{resource_id}/availability:
    get:
      tags: [Resources]
      summary: When a resource is already taken
      description: >
        Expands the weekly slots pointing at this resource over the range,
        inclusive of both ends, and unions in the reservations and the days
        the nightly generator has already written. A slot counts when its
        cycle is flagged open; cycle date bounds are not consulted, because
        nightly ledger generation does not consult them either, and answering
        otherwise would report a room free on a date the generator is going to
        fill.


        A generated day counts whatever its cycle now says: closing a cycle
        does not withdraw the days it has already produced, deleting a slot
        leaves behind the days attendance was marked on, and the database
        refuses a second booking on top of either. Where a day and the slot it
        came from both cover a date you get the day, once, because the day is
        the row that holds the hour and keeps its window when the slot is
        corrected later. Dates the generator has not reached yet come from the
        slot. An inactive resource still answers: retiring a room does not
        clear its calendar.


        A busy interval's date can be the day before `from`. A booking
        that runs past midnight is dated the day it opened on and occupies
        the morning after, so a caller asking about Tuesday is told about a
        hold dated Monday that ends at six. Read each interval by its own
        date and end_date and not by the range that returned it: grouping
        by date alone files that hold under a day nobody asked about, and
        discarding anything outside the range shows a ward as free while it
        is staffed.
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-01-05"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-01-11"
      responses:
        "200":
          description: The busy intervals in the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            from was after to, or the inclusive range was longer than 366
            days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/resources/{resource_id}/reservations:
    post:
      tags: [Resources]
      summary: Hold a resource for one dated window
      description: >
        Requires `SUPER_ADMIN` or `UNIT_ADMIN`. The route an outside system
        uses to take a room. What it refuses is exactly what GET availability
        calls busy, through the same queries and the same expansion, so a
        caller cannot read an hour as free and then be refused it.


        The rule runs both ways. A class cannot be put on top of a hold
        either, so POST /schedule/slots, PATCH /schedule/slots/{slot_id} and
        a CSV upload are each refused where a booking already stands. A hold
        taken here holds against the timetable and not only against other
        holds.


        Windows are half open, so an interval ending at ten and one starting
        at ten do not clash. A window may end earlier than it starts, and
        that is how it says it runs past midnight: 22:00 to 06:00 is a
        night shift of eight hours, and date is the day it opens on. Equal
        times are refused, because 09:00 to 09:00 is either nothing at all
        or a full day and there is no way to tell which was meant.


        A weekly slot reads its two times by the same rule, so an overnight
        booking is checked against night shifts on the timetable as well as
        against day ones.
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Unique across every caller and every resource. A UUID is the right
            shape. Required rather than optional because a booking client
            retries, and a retry that books a second room is worse than one
            that fails.
          schema:
            type: string
            minLength: 8
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreate"
      responses:
        "201":
          description: The hold was taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "200":
          description: >
            The same key and the same body arrived again. This is the original
            hold, cancelled or not: a retry is asking what happened, not
            asking for a second room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Something already holds part of that window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationConflict"
        "422":
          description: >
            end was not after start, or the Idempotency-Key had already been
            used for a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/resources/{resource_id}/reservations/{reservation_id}:
    delete:
      tags: [Resources]
      summary: Let a hold go
      description: >
        Requires `SUPER_ADMIN` or `UNIT_ADMIN`. Marks the reservation
        cancelled and leaves the row in place. A deleted row cannot be told to
        anybody, and a system that was informed the room was held has to be
        able to learn that it no longer is.


        The freed window is bookable again immediately and stops appearing in
        availability. Cancelling twice is not an error and returns the same
        timestamp. Cancelling through the wrong resource id is a 404.


        A hold is let go by whoever took it. A `UNIT_ADMIN` that did not make
        the reservation gets a 403; a `SUPER_ADMIN` overrides, because a hold
        taken by an account that no longer exists has nobody left to cancel
        it.
      parameters:
        - name: resource_id
          in: path
          required: true
          schema:
            type: integer
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The cancelled hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Schedule ──────────────────────────────
  /api/v1/schedule/slots:
    get:
      tags: [Schedule]
      summary: List master slots
      description: >
        The recurring timetable, before any day is generated from it. Filter
        by cycle to get one term's worth.
      parameters:
        - name: cycle_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Master slots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterSlotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Schedule]
      summary: Add a master slot
      description: >
        Admin only. A UNIT_ADMIN may only add slots inside their own unit.


        Refused with 409 where the room is already taken for part of that
        window, whether by a booking or by another class. Only holds from
        today forward count, because a slot lays down days from now onwards
        and never backwards, and a slot in a closed cycle is neither checked
        nor counted against, because such a slot does not occupy the room and
        a booking is already accepted on top of one. Every open cycle counts,
        including a second one covering a different part of the year: the
        nightly generator lays every open cycle onto today, so all of them
        hold the room today.


        Refused with 409 as well where a day has already been generated on
        that room in part of that window. Such a day may have no slot
        speaking for it any more: closing a cycle leaves behind the days it
        has already produced, and deleting a slot leaves behind the days that
        carry attendance. Both of those read as free to the two checks above
        while somebody is still due at the door, so this one has no cycle
        gate on either side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterSlotCreate"
      responses:
        "200":
          description: The slot's id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The room is taken for part of that window, either by a booking or
            by another class already on the timetable. The message says which.
            The body is the one a refused booking sends, so a clash reads the
            same way whichever end it came from; a conflict caused by a class
            names the activity and carries a null reservation_id, and one
            caused by a booking does the reverse. Slots in a closed cycle
            occupy nothing and are not counted, but the days such a slot has
            already generated do, and a clash with one of those is refused
            here too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/slots/{slot_id}:
    patch:
      tags: [Schedule]
      summary: Change a master slot, and the days it has already produced
      description: >
        Admin only. A new window, lead or room is copied onto the days that
        are still plans, while days carrying attendance or a note are counted
        and left alone. Only days after today are moved, so a class shifted
        to 10:00 runs at 10:00 from tomorrow and the days it already ran at
        09:00 still say 09:00.


        Moving the slot to another weekday is the one change that cannot be
        copied across, because the days already generated sit on the old
        weekday. Those are withdrawn for the generator to lay down again, and
        the request is refused with 409 if any of them has been marked.


        Also refused with 409 where the room it would move to is already
        taken for part of the window it would move to, by a booking or by
        another class. The slot's own window is not counted against it, so
        widening one is not refused by the window it replaces. A refusal
        changes nothing: the room is resolved and the clashes are checked
        before any day is withdrawn or any field is written.


        A change that leaves the room, weekday and window alone is not
        checked, so a new lead can be set on a slot a hold is already sitting
        on. Such a hold predates this rule or was written straight into the
        database, and refusing would leave the lead unfixable short of
        cancelling somebody else's booking.


        A day already generated on that room in part of the window refuses
        the change as well, with no cycle gate on either side, because such a
        day still puts somebody at a door whatever its cycle now says. The
        check is made before anything is written and again if the database
        refuses the write anyway: two admins moving two classes onto one room
        at the same moment both pass the first ask, and the loser is told
        what beat it rather than handed a 500.
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterSlotUpdate"
      responses:
        "200":
          description: What the change reached and what it left alone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotUpdateResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Either a day the slot has already produced has been marked, and
            the detail names those dates, or the room is taken for part of the
            window by a booking or by another class, and the body is the one a
            refused booking sends. A day already generated on that room is a
            third reason, and reads as a class in the body. A change that does
            not move the class, a new lead for instance, is checked against
            none of them.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ReservationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      tags: [Schedule]
      summary: Take a master slot off the timetable
      description: >
        Admin only. Days from today onward are still plans and are removed;
        days already past keep their attendance and notes and are left with
        no slot to point at. If any day from today onward has been marked,
        nothing is deleted and the response names those dates.


        A detached day keeps its window. The day was copied off the slot when
        it was generated, so losing the slot does not lose the hour it ran at
        and it stays a timed event on a calendar feed. Days generated before
        the ledger carried its own window have none to keep and still appear
        as all-day events.
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: What was removed and what was kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotDeletionResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/schedule/ledger/today:
    get:
      tags: [Schedule]
      summary: Today's ledger entries for the authenticated user
      description: >
        Staff receive entries where they are the active or substitute lead.
        Members receive entries for their registered activities.
        Admins receive all entries.
      responses:
        "200":
          description: Today's schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLedgerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/schedule/ledger/{ledger_id}:
    patch:
      tags: [Schedule]
      summary: Update a ledger entry
      description: Staff/Admin only. Used to set substitute, delivery format, or override geofence coords.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyLedgerUpdate"
      responses:
        "200":
          description: Updated ledger entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLedgerResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedule/staff/{staff_id}/location:
    get:
      tags: [Schedule]
      summary: Resolve a staff member's current location via 4-tier resolver
      parameters:
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLocationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedule/staff/all/locations:
    get:
      tags: [Schedule]
      summary: Snapshot of all staff locations (Member Locator feed)
      responses:
        "200":
          description: All staff locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLocationResponse"

  /api/v1/schedule/cycles:
    get:
      tags: [Schedule]
      summary: List planning cycles
      responses:
        "200":
          description: Cycle list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningCycleResponse"

    post:
      tags: [Schedule]
      summary: Create a new planning cycle
      description: Requires `SUPER_ADMIN` or `UNIT_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningCycleCreate"
      responses:
        "201":
          description: Cycle created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningCycleResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/schedule/cycles/{cycle_id}/close:
    patch:
      tags: [Schedule]
      summary: Close an active planning cycle
      description: Sets `operational_status = false`. Requires admin.
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningCycleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedule/cycles/{cycle_id}/open:
    patch:
      tags: [Schedule]
      summary: Put a drafted planning cycle into service
      description: >
        Sets `operational_status = true`, and it is the only thing that does.
        A cycle can be created closed, filled in over as long as that takes,
        and opened once it is ready.


        Not a flag flip. A slot entered into a closed cycle is never checked
        against the bookings or against the rest of the timetable, because a
        closed cycle's slots occupy nothing, and every one of them starts
        occupying its room the moment the flag goes true. The checks
        `POST /schedule/slots` would have run are run here over every slot in
        the cycle at once, the cycle's own slots counting against each other,
        and the whole open is refused where any of them lands on a room that
        is taken. A refused open writes nothing.


        Opening a cycle that is already open changes nothing. Requires admin.
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle opened, or already open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cycle 3 opened
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A slot in the cycle would land on a room already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleActivationConflict"

  /api/v1/schedule/cycles/{old_id}/clone-to/{new_id}:
    post:
      tags: [Schedule]
      summary: Clone all activity offerings from one cycle to another
      description: >
        Copies `StructuralMasterSlot` and `Activity` records.
        Member enrollment and attendance records are **not** cloned.
        Re-import CSV after cloning to update enrollment.
      parameters:
        - name: old_id
          in: path
          required: true
          schema:
            type: integer
        - name: new_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Clone complete. Returns count of cloned offerings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cloned_offerings:
                    type: integer

  # ── Attendance ────────────────────────────
  /api/v1/attendance/mark:
    post:
      tags: [Attendance]
      summary: Mark single member attendance
      description: >
        Members may only mark themselves. Anyone else must be the ledger's
        assigned or substitute lead, or an admin, and a UNIT_ADMIN only within
        their own unit. Same rule as `/attendance/batch`.
        A ledger that carries `latitude_target` and `longitude_target` is
        geo-fenced: a member must send `user_lat` and `user_lon`, and the
        backend checks Haversine surface distance against
        `precision_radius_meters`. `user_alt` is optional and only adds a
        floor check when the ledger also carries an `altitude_target`.
        Omitting the coordinates on a fenced session returns 400; there is no
        client-side way to skip the fence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceMarkRequest"
      responses:
        "201":
          description: Attendance marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
        "400":
          description: Geofence violation or duplicate mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/attendance/batch:
    post:
      tags: [Attendance]
      summary: Batch mark attendance for multiple members
      description: Staff/Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatchRequest"
      responses:
        "200":
          description: Batch result summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked:
                    type: integer
                  skipped:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/attendance/ledger/{ledger_id}:
    get:
      tags: [Attendance]
      summary: Get the roster for a ledger entry
      description: >
        Whoever runs the session gets every row: the assigned lead, the
        substitute, a super admin, or a unit admin inside that unit. A member
        gets their own row and nothing else. Anyone else is refused rather
        than handed an empty list.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attendance/absence:
    post:
      tags: [Attendance]
      summary: Submit an absence request (Reverse RSVP)
      description: >
        Staff submit a request for a future absence.
        The request is routed to `reporting_line_manager` for approval.
        On approval, the relevant daily ledger entry transitions to `ON_LEAVE`
        and a WebSocket event is broadcast to the staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseRsvpCreate"
      responses:
