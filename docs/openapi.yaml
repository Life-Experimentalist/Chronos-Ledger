          description: Absence request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseRsvpResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/attendance/absence/pending:
    get:
      tags: [Attendance]
      summary: List absence requests pending the caller's approval
      description: Managers/Admins only. Returns requests where caller is the line manager.
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReverseRsvpResponse"

  /api/v1/attendance/absence/{log_id}/decide:
    patch:
      tags: [Attendance]
      summary: Approve or deny an absence request
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpDecision"
      responses:
        "200":
          description: Decision recorded. If approved, ledger entry updated and WebSocket event fired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseRsvpResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attendance/annotations:
    post:
      tags: [Attendance]
      summary: Create a ledger annotation
      description: >
        Freeform notes about a session: lab issues, late starts, a handover.
        Restricted to whoever runs it, meaning the assigned lead, the
        substitute, a super admin, or a unit admin inside that unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationCreate"
      responses:
        "200":
          description: Annotation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attendance/annotations/{ledger_id}:
    get:
      tags: [Attendance]
      summary: Get all annotations for a ledger entry
      description: >
        The same gate as writing one. Unlike the roster there is no
        per-member fallback, because a note is about the session rather than
        about one person in it.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Annotations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Guest Gate ────────────────────────────
  /api/v1/guest/register-checkin:
    post:
      tags: [Guest Gate]
      summary: Register an organization visitor (kiosk)
      description: >
        The visitor does not authenticate; the kiosk device does, with an
        admin-issued API key in `X-API-Key`.
        Fires a `GUEST_HANDSHAKE_REQ` WebSocket event to the target staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestCheckInRequest"
      responses:
        "201":
          description: Guest registered. Staff notified via WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        "404":
          description: Target staff not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/guest/directory:
    get:
      tags: [Guest Gate]
      summary: Staff availability directory (kiosk)
      description: >
        Returns staff with OPEN_AD_HOC or VERY_FREE status for kiosk display.
        Requires a credential: this response carries the staff roster and each
        person's live presence.
      parameters:
        - name: name
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: >
            Case-insensitive search by staff name. Two characters minimum, so
            the roster cannot be walked one letter at a time.
      responses:
        "200":
          description: Available staff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityResponse"

  /api/v1/guest/pending:
    get:
      tags: [Guest Gate]
      summary: List pending guest requests for authenticated staff
      description: Returns guests targeting the authenticated staff member with PENDING_VERIFICATION status.
      responses:
        "200":
          description: Pending guest requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestResponse"

  /api/v1/guest/{entry_id}/decide:
    patch:
      tags: [Guest Gate]
      summary: Accept or decline a guest visit
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDecisionRequest"
      responses:
        "200":
          description: Decision recorded. If approved, guest receives notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Ingestion ─────────────────────────────
  /api/v1/ingestion/upload-csv:
    post:
      tags: [Ingestion]
      summary: Bulk import schedule from CSV
      description: >
        Requires `SUPER_ADMIN`. The matrix rewrites activities and
        registrations across every unit, so a unit-scoped admin cannot
        upload it.
        The CSV must contain these columns (case-sensitive):
        `member_id`, `member_name`, `member_email`, `activity_code`, `activity_title`,
        `unit`, `day_of_week_index` (ISO 8601: 1=Monday .. 7=Sunday), `time_window_start` (HH:MM),
        `time_window_end` (HH:MM), `lead_id`, `room`.

        Creates/updates: Users, ActivityOfferings, StructuralMasterSlots, ActivityRegistrations.
        Idempotent, re-uploading the same CSV is safe: an existing member
        keeps their password.


        Never removes. Slots and enrollments the cycle holds that the file
        does not mention come back in `not_in_file` for somebody to act on,
        which is what makes a partial upload safe.


        A row that would put a class in a room already taken for that window,
        by a booking, by another class, or by a day already generated onto
        it, is refused with 422 and the whole file is rolled back, which is
        what every other bad row in an import does. Rows are checked against
        each other as well as against what is already stored, so one file
        cannot put two classes in one room at one hour. The check only looks
        where a row would actually move a class, so re-uploading a file that
        describes the timetable as it already stands is not refused by what
        is sitting on it.


        A closed cycle changes two of those three. Its slots occupy nothing,
        so an upload into one is not checked against the bookings or against
        the rest of the timetable, the same way a slot in a closed cycle does
        not block a booking. The days already generated are checked either
        way, because a correction is copied onto them whatever the cycle says
        and the database refuses to move one onto a room something else is
        holding.

        Each new member costs a bcrypt hash on the request thread, about
        half a second, so a file creating more than roughly 100 new
        members will exceed the 60s client and proxy timeouts. Split it.
      parameters:
        - name: cycle_id
          in: query
          required: true
          schema:
            type: integer
          description: Target planning cycle ID.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
        "400":
          description: The upload is not named `.csv`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            The file was refused and nothing was saved. `detail` says why, and
            names the line where the file is at fault: a missing column, an
            unparseable time, an address already belonging to somebody else, a
            room already taken for that window. Where the failure is the
            server's rather than the file's, `detail` says only that the import
            failed and that the reason is in the server log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/ingestion/generate-ledger:
    post:
      tags: [Ingestion]
      summary: Trigger daily ledger generation
      description: >
        Requires admin. Generates `DailyLedger` rows from
        `StructuralMasterSlot` for a given date, tomorrow by default. The
        same job the nightly cron runs. Safe to re-run: a day already written
        for a slot is skipped.


        A day is skipped as well where the room is already taken for part of
        that window by another day. Two slots on one room at one hour is a
        state the API refuses to create, and a database holding one anyway
        materializes the slot that was put on the timetable first and drops
        the other. The dropped day is written to the server log naming the
        slot, the date and the room. It is not in this response.
      parameters:
        - name: target_date
          in: query
          required: false
          description: Date to generate. Defaults to tomorrow.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Generation complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: generated
                  date:
                    type: string
                    format: date
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Calendar Sync ─────────────────────────
  /api/v1/sync/feed-token:
    get:
      tags: [Calendar Sync]
      summary: Get the caller's calendar feed token
      description: >
        Returns the token that keys the caller's iCalendar feed, minting one on
        the first call. `feed_path` is the path to subscribe, already built from
        the token. The token is the only thing guarding the feed, so hand it out
        the way a password is handed out.
      responses:
        "200":
          description: The feed token and the path built from it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sync/feed-token/rotate:
    post:
      tags: [Calendar Sync]
      summary: Replace the caller's calendar feed token
      description: >
        Mints a new token and invalidates the old one. Every calendar app
        subscribed to the old path stops updating and has to be resubscribed,
        which is the point: this is what to call when a feed URL has leaked.
      responses:
        "200":
          description: The new feed token and the path built from it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sync/user-feed/{feed_token}.ics:
    get:
      tags: [Calendar Sync]
      summary: iCalendar feed for a user (rolling 37-day window)
      description: >
        Subscribe this URL directly in Google Calendar, Apple Calendar, or Outlook.
        Returns standard iCalendar (text/calendar) content.
        Staff feed includes all sessions where they are active or substitute lead.
        Member feed includes all registered activities.
        Timed sessions are written as UTC instants (DTSTART and DTEND end in Z),
        converted from the organization's wall clock through ORG_TIMEZONE, so a
        subscriber reading the feed from anywhere sees the session at the moment
        it happens. An entry with no window of its own is an all-day date and
        carries no zone, because a date reads the same everywhere. That is an
        ad-hoc day nobody gave a time to, or a day generated before the ledger
        carried its own window.
      parameters:
        - name: feed_token
          in: path
          required: true
          schema:
            type: string
          description: >
            The token from `GET /api/v1/sync/feed-token`, not a user id. The
            feed itself is unauthenticated so a calendar app can poll it, which
            leaves the token as the only thing guarding it.
      responses:
        "200":
          description: iCalendar feed.
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\nVERSION:2.0\n..."
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── WebSocket ─────────────────────────
  /api/v1/ws/stats:
    get:
      tags: [WebSocket]
      summary: Count of open websocket connections
      description: >
        Requires `SUPER_ADMIN`. The count is organization-wide, and there is
        nothing in it a unit admin could be shown only their own share of.
      responses:
        "200":
          description: Open connection count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  online_connections:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Health ────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      description: Used by Docker healthcheck. Returns 200 when the app is ready.
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

# ─────────────────────────────────────────────
# WebSocket (informational, not an HTTP path)
# ─────────────────────────────────────────────
# WebSocket endpoint: ws://<server>/ws
#
# The server accepts the socket, then waits five seconds for one frame naming
# the token:
#
#   { "event": "AUTH", "payload": { "token": "<jwt>" } }
#
# It answers { "event": "AUTHENTICATED", "payload": {} } and begins routing
# domain events to this client. A refused token closes with 4003; silence past
# the five seconds closes with 4008. The token is checked the way an HTTP
# request's is, so one naming an account that is gone, or an admin who has not
# chosen a password yet, is refused here too.
#
# Not a query parameter on purpose: a query string lands in the proxy's access
# log and the browser's history, and is sent onward as a Referer.
#
# Inbound frames (server → client):
#
#   { "event": "ABSENCE_APPROVAL_REQUIRED",
#     "payload": { "log_id": 12, "from": "Prof. A", "date": "2026-06-15" } }
#
#   { "event": "ABSENCE_DECISION",
#     "payload": { "log_id": 12, "decision": "VERIFIED_APPROVED" } }
#
#   { "event": "GUEST_HANDSHAKE_REQ",
#     "payload": { "transaction_reference": 5, "guest_name": "J. Smith",
#                  "originating_body": "TechCorp", "intent": "..." } }
#
#   { "event": "LEDGER_STATE_CHANGE",
#     "payload": { "ledger_id": 1042, "new_state": "ON_LEAVE" } }
#
# The AUTH frame is the only thing a client sends upstream.
