  /api/v1/schedule/activities/{activity_id}/retire:
    post:
      operationId: schedule.retireActivity
      tags: [Schedule]
      summary: Retire an activity
      description: >
        Admin only, inside the admin's unit. Nothing is deleted that has
        happened. The activity and every slot it still has are marked
        retired, so the generator writes no more days for them and their
        rooms are free again. Days from today onward that nobody has marked
        or annotated are removed; days that carry attendance or a note are
        kept; days before today are not touched.


        A retired activity stays readable through GET
        /schedule/activities/{activity_id} and is left out of the list
        unless `include_retired` is set. It cannot be edited, given slots or
        members, or retired again (409 `STATE_CONFLICT`), and a CSV import
        that names it is refused. Its code stays taken in the cycle.
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: What retiring removed and what it kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetireResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The activity is already retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/activities/{activity_id}/enrollments:
