          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/slots:
    get:
      operationId: schedule.listSlots
      tags: [Schedule]
      summary: List master slots
      description: >
        The recurring timetable, before any day is generated from it. Filter
        by cycle to get one term's worth. Retired slots are left out unless
        `include_retired` is set.
      parameters:
        - name: cycle_id
          in: query
          required: false
          schema:
            type: integer
        - name: include_retired
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Master slots.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterSlotResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: schedule.createSlot
      tags: [Schedule]
      summary: Add a master slot
      description: >
        Admin only. A UNIT_ADMIN may only add slots inside their own unit.
        The new slot fills the days ahead at once, through the same generator
        a CSV import and the nightly job use. A retired activity takes no new
        slots (409 `STATE_CONFLICT`).


        Refused with 409 where the room is already taken for part of that
        window, whether by a booking or by another class. Only holds from
        today forward count, because a slot lays down days from now onwards
        and never backwards, and a slot in a closed cycle is neither checked
        nor counted against, because such a slot does not occupy the room and
        a booking is already accepted on top of one. Every open cycle counts,
        including a second one covering a different part of the year: the
        nightly generator lays every open cycle onto today, so all of them
        hold the room today.


        Refused with 409 as well where a day has already been generated on
        that room in part of that window. Such a day may have no slot
        speaking for it any more: closing a cycle leaves behind the days
        ahead that carry attendance or a note, and deleting a slot leaves
        behind the days that carry attendance. Both of those read as free to the two checks above
        while somebody is still due at the door, so this one has no cycle
        gate on either side.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterSlotCreate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: The slot's id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The activity, or the user named in `primary_lead_id`, does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The room is taken for part of that window, either by a booking or
            by another class already on the timetable. The message says which.
            The body is the one a refused booking sends, so a clash reads the
            same way whichever end it came from; a conflict caused by a class
            names the activity and carries a null reservation_id, and one
            caused by a booking does the reverse. Slots in a closed cycle
            occupy nothing and are not counted, but the days such a slot has
            already generated do, and a clash with one of those is refused
            here too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationConflict"
        "422":
          description: >
            A malformed body, or a `primary_lead_id` naming somebody who has been deactivated.
            A key reused with a different request is `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/schedule/slots/{slot_id}:
    patch:
      operationId: schedule.updateSlot
      tags: [Schedule]
      summary: Change a master slot, and the days it has already produced
      description: >
        Admin only. A new window, lead or room is copied onto the days that
        are still plans, while days carrying attendance or a note are counted
        and left alone. Only days after today are moved, so a class shifted
        to 10:00 runs at 10:00 from tomorrow and the days it already ran at
        09:00 still say 09:00.


        A new rrule or dtstart is the one change that cannot be copied
        across, because the days already generated sit on the dates of the
        old rule. Those are withdrawn for the generator to lay down again, and
        the request is refused with 409 if any of them has been marked.


        Also refused with 409 where the room it would move to is already
        taken for part of the window it would move to, by a booking or by
        another class. The slot's own window is not counted against it, so
        widening one is not refused by the window it replaces. A refusal
        changes nothing: the room is resolved and the clashes are checked
        before any day is withdrawn or any field is written.


        A change that leaves the room, rule and window alone is not
        checked, so a new lead can be set on a slot a hold is already sitting
        on. Such a hold predates this rule or was written straight into the
        database, and refusing would leave the lead unfixable short of
        cancelling somebody else's booking.


        A day already generated on that room in part of the window refuses
        the change as well, with no cycle gate on either side, because such a
        day still puts somebody at a door whatever its cycle now says. The
        check is made before anything is written and again if the database
        refuses the write anyway: two admins moving two classes onto one room
        at the same moment both pass the first ask, and the loser is told
        what beat it rather than handed a 500.
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasterSlotUpdate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: What the change reached and what it left alone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotUpdateResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The slot, or the user named in `primary_lead_id`, does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Either a day the slot has already produced has been marked, and
            the detail names those dates, or the room is taken for part of the
            window by a booking or by another class, and the body is the one a
            refused booking sends. A day already generated on that room is a
            third reason, and reads as a class in the body. A change that does
            not move the class, a new lead for instance, is checked against
            none of them.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ReservationConflict"
        "422":
          description: >
            A malformed body, a window that starts and ends at the same time,
            or a `primary_lead_id` naming somebody who has been deactivated.
            A key reused with a different request is `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: schedule.deleteSlot
      tags: [Schedule]
      summary: Take a master slot off the timetable
      description: >
        Admin only. Days from today onward are still plans and are removed;
        days already past keep their attendance and notes and are left with
        no slot to point at. If any day from today onward has been marked,
        nothing is deleted and the response names those dates.


        A detached day keeps its window. The day was copied off the slot when
        it was generated, so losing the slot does not lose the hour it ran at
        and it stays a timed event on a calendar feed. Days generated before
        the ledger carried its own window have none to keep and still appear
        as all-day events.
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: What was removed and what was kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotDeletionResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/slots/{slot_id}/retire:
    post:
      operationId: schedule.retireSlot
      tags: [Schedule]
      summary: Retire a master slot
      description: >
        Admin only, inside the admin's unit. Where DELETE refuses while a day
        ahead carries attendance or a note, this keeps that day and removes
        the days ahead that are still plans. Days before today are not
        touched. The slot stays, marked retired, so the generator writes no
        more days for it and its room is free again. A retired slot cannot be
        edited, deleted or retired again (409 `STATE_CONFLICT`), and a CSV
        row naming it is refused.
      parameters:
        - name: slot_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: What retiring removed and what it kept.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetireResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The slot is already retired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/ledger/today:
    get:
      operationId: schedule.getTodayLedger
      tags: [Schedule]
      summary: Today's ledger entries for the authenticated user
      description: >
        Staff receive entries where they are the active or substitute lead.
        Members receive entries for their registered activities.
        Admins receive all entries.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Today's schedule.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLedgerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/schedule/ledger:
    get:
      operationId: schedule.listLedger
      tags: [Schedule]
      summary: Ledger entries between two dates
      description: >
        Both dates included, ordered by date, then start time. Rows and the
        role filter are the same as `/schedule/ledger/today`. `to` before
        `from` is refused with 422.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: resource_id
          in: query
          required: false
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The ledger over the range.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyLedgerResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/conflicts:
    get:
      operationId: schedule.listConflicts
      tags: [Schedule]
      summary: Clashes already in the schedule between two dates
      description: >
        Reports two rows holding one resource at once, and one member enrolled
        in two activities that run at once. It reads and reports; nothing is
        refused or changed. Both dates are included. `to` before `from`, or a
        range longer than 92 days, is refused with 422 and code
        INVALID_VALUE. ORG_ADMIN and UNIT_ADMIN only.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The clashes over the range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/ledger/{ledger_id}:
    patch:
      operationId: schedule.updateLedgerEntry
      tags: [Schedule]
      summary: Update a ledger entry
      description: >
        Requires `ORG_ADMIN` or `UNIT_ADMIN`, and a unit admin only within
        their own unit. Sets the substitute, the delivery format, or the day's
        own geofence. A field left out, or sent as null, keeps its current
        value.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyLedgerUpdate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: The entry was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Updated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The ledger entry, or the user named in `substitute_lead_id`, does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            A malformed body, or a `substitute_lead_id` naming somebody who has been deactivated.
            A key reused with a different request is `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/schedule/staff/{staff_id}/location:
    get:
      operationId: schedule.getStaffLocation
      tags: [Schedule]
      summary: Resolve a staff member's current location via 4-tier resolver
      parameters:
        - name: staff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLocationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedule/staff/all/locations:
    get:
      operationId: schedule.listStaffLocations
      tags: [Schedule]
      summary: Snapshot of all staff locations (Member Locator feed)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: All staff locations.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLocationResponse"

  /api/v1/schedule/cycles:
    get:
      operationId: schedule.listCycles
      tags: [Schedule]
      summary: List planning cycles
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Cycle list.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningCycleResponse"

    post:
      operationId: schedule.createCycle
      tags: [Schedule]
      summary: Create a new planning cycle
      description: >
        Requires `ORG_ADMIN`. The two dates are the days the cycle's slots
        run on, both included. An end earlier than the start is refused with
        422; equal dates are a cycle of one day.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningCycleCreate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Cycle created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningCycleResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/cycles/{cycle_id}/close:
    patch:
      operationId: schedule.closeCycle
      tags: [Schedule]
      summary: Take a planning cycle out of service
      description: >
        Sets `operational_status = false`, so the nightly generator writes no
        more days for the cycle's slots, and removes the days it has already
        written from today onward, which are still only plans. A day that
        carries attendance or a note is kept rather than refused over. Days
        before today are not touched.


        Closing a cycle that is already closed runs the same sweep. Requires
        `ORG_ADMIN`.
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Cycle closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cycle 3 closed
                  ledger_rows_removed:
                    type: integer
                    description: Days from today onward that were withdrawn.
                  ledger_rows_kept:
                    type: integer
                    description: Days from today onward kept because they carry attendance or a note.
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/cycles/{cycle_id}/open:
    patch:
      operationId: schedule.openCycle
      tags: [Schedule]
      summary: Put a drafted planning cycle into service
      description: >
        Sets `operational_status = true`, and it is the only thing that does.
        A cycle can be created closed, filled in over as long as that takes,
        and opened once it is ready.


        Not a flag flip. A slot entered into a closed cycle is never checked
        against the bookings or against the rest of the timetable, because a
        closed cycle's slots occupy nothing, and every one of them starts
        occupying its room the moment the flag goes true. The checks
        `POST /schedule/slots` would have run are run here over every slot in
        the cycle at once, the cycle's own slots counting against each other,
        and the whole open is refused where any of them lands on a room that
        is taken. A refused open writes nothing.


        Opening a cycle that is already open changes nothing. Requires
        `ORG_ADMIN`.
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Cycle opened, or already open.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cycle 3 opened
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A slot in the cycle would land on a room already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleActivationConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/schedule/cycles/{old_id}/clone-to/{new_id}:
    post:
      operationId: schedule.cloneCycle
      tags: [Schedule]
      summary: Copy one cycle's activities and weekly slots into another
      description: >
        Copies every `Activity` in the old cycle and every
        `StructuralMasterSlot` under them, each slot pointed at its activity's
        copy with the same lead, room and window. Member enrollment and
        attendance records are **not** cloned. Re-import CSV after cloning to
        update enrollment. Retired activities and retired slots are left
        behind.


        The target must be closed and have no activities. The copied slots
        are not checked against the rooms here; opening the target runs those
        checks over all of them at once. Requires `ORG_ADMIN`.
      parameters:
        - name: old_id
          in: path
          required: true
          schema:
            type: integer
        - name: new_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Clone complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cloned:
                    type: integer
                    description: Activities copied.
                  cloned_slots:
                    type: integer
                    description: Weekly slots copied.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target cycle is open or already has activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Attendance ────────────────────────────
  /api/v1/attendance/mark:
    post:
      operationId: attendance.mark
      tags: [Attendance]
      summary: Mark single member attendance
      description: >
        Members may only mark themselves. Anyone else must be the ledger's
        assigned or substitute lead, or an admin, and a UNIT_ADMIN only within
        their own unit. Same rule as `/attendance/batch`.
        A ledger that carries `latitude_target` and `longitude_target` is
        geo-fenced: a member must send `user_lat` and `user_lon`, and the
        backend checks Haversine surface distance against
        `precision_radius_meters`. `user_alt` is optional and only adds a
        floor check when the ledger also carries an `altitude_target`.
        Omitting the coordinates on a fenced session returns 400; there is no
        client-side way to skip the fence. When the member sends
        `user_accuracy`, a fix coarser than `GEOFENCE_ACCURACY_FACTOR` times
        the radius also returns 400.
        Marking a member again replaces their status rather than adding a
        second row.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceMarkRequest"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Attendance marked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: marked
                  member_id:
                    type: string
                  marking_status:
                    $ref: "#/components/schemas/VerificationMetric"
        "400":
          description: >
            Outside the geofence, or a fenced session marked without
            coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such ledger, or no such member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/attendance/batch:
    post:
      operationId: attendance.markBatch
      tags: [Attendance]
      summary: Batch mark attendance for multiple members
      description: >
        For whoever runs the session, on the same rule as
        `/attendance/mark`: the ledger's assigned or substitute lead, or an
        admin, and a UNIT_ADMIN only within their own unit. Every record must
        repeat the batch's `ledger_instance_id` and no member may appear
        twice, or the batch is refused with 422. A member id matching nobody
        is refused with 404. A refused batch writes nothing; an accepted one
        is written in one transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBatchRequest"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Every record written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: batch_complete
                  count:
                    type: integer
                    description: Records in the batch.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such ledger, or a record names a member who does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            A record names a different ledger from the batch, or one member
            appears twice.
            A key reused with a different request is `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/attendance/ledger/{ledger_id}:
    get:
      operationId: attendance.listForLedger
      tags: [Attendance]
      summary: Get the roster for a ledger entry
      description: >
        Whoever runs the session gets every row: the assigned lead, the
        substitute, an organization admin, or a unit admin inside that unit. A member
        gets their own row and nothing else. Anyone else is refused rather
        than handed an empty list.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Attendance records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/attendance/absence:
    post:
      operationId: attendance.submitAbsence
      tags: [Attendance]
      summary: Submit an absence request (Reverse RSVP)
      description: >
        Any signed-in user whose account names a `reporting_line_manager` can
        submit one. The request is routed to that manager for approval, and
        the manager is sent an `ABSENCE_APPROVAL_REQUIRED` WebSocket frame.
        On approval, every daily ledger row the submitter leads on that date
        becomes `ON_LEAVE` and loses its substitute. Either decision sends the
        submitter an `ABSENCE_DECISION` frame.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseRsvpCreate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Absence request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseRsvpResponse"
        "400":
          description: >
            The caller has no manager set, or the one set has been
            deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/attendance/absence/pending:
    get:
      operationId: attendance.listPendingAbsences
      tags: [Attendance]
      summary: List absence requests pending the caller's approval
      description: >
        Any signed-in user. Returns the undecided requests the caller may
        decide: those routed to them as the submitter's line manager and,
        for an admin, those whose manager has since been deactivated. A
        ORG_ADMIN gets every one of those, a UNIT_ADMIN those from the
        non-admin accounts of their own unit, and nobody gets their own.
      responses:
        "200":
          description: Pending requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReverseRsvpResponse"

  /api/v1/attendance/absence/{log_id}/decide:
    patch:
      operationId: attendance.decideAbsence
      tags: [Attendance]
      summary: Approve or deny an absence request
      description: >
        The manager the request went to decides it or, once that manager is
        deactivated, an admin by the rules of the pending list. Whoever
        decides becomes `authorized_by_user_id` and can revisit the decision.
      parameters:
        - name: log_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpDecision"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: >
            Decision recorded. Approval turns the submitter's sessions that
            day `ON_LEAVE`, and either decision sends them an
            `ABSENCE_DECISION` WebSocket frame.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/LogVerificationState"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such request, or not one the caller may decide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/attendance/annotations:
    post:
      operationId: attendance.createAnnotation
      tags: [Attendance]
      summary: Create a ledger annotation
      description: >
        Freeform notes about a session: lab issues, late starts, a handover.
        Restricted to whoever runs it, meaning the assigned lead, the
        substitute, an organization admin, or a unit admin inside that unit.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationCreate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Annotation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/attendance/annotations/{ledger_id}:
    get:
      operationId: attendance.listAnnotations
      tags: [Attendance]
      summary: Get all annotations for a ledger entry
      description: >
        The same gate as writing one. Unlike the roster there is no
        per-member fallback, because a note is about the session rather than
        about one person in it.
      parameters:
        - name: ledger_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Annotations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Guest Gate ────────────────────────────
  /api/v1/guest/register-checkin:
    post:
      operationId: guest.checkIn
      tags: [Guest Gate]
      summary: Register an organization visitor (kiosk)
      description: >
        The visitor does not authenticate; the kiosk device does, with an
        admin-issued API key in `X-API-Key`.
        Sends a `GUEST_HANDSHAKE_REQ` WebSocket frame to the target staff
        member. The kiosk and the visitor learn the decision from
        `/guest/visit/{code}`, with the code this response carries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestCheckInRequest"
      responses:
        "200":
          description: Guest registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration_state:
                    type: string
                    example: PENDING_STAFF_AUTH
                  reference_token:
                    type: integer
                    description: The entry id that `/guest/{entry_id}/decide` takes.
                  visit_code:
                    type: string
                    example: 7KQM-3XHP-R9DW-4TNC
                    description: >
                      The visitor's code for `/guest/visit/{code}`. It is in
                      this response and nowhere else: the server keeps only
                      its hash.
        "404":
          description: Target staff not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/guest/directory:
    get:
      operationId: guest.getDirectory
      tags: [Guest Gate]
      summary: Staff availability directory (kiosk)
      description: >
        Returns active staff whose name matches, busy ones included, each with
        an availability label for kiosk display. Twenty at a time by default,
        in name order; X-Total-Count says how many matched.
        Requires a credential: this response carries the staff roster and each
        person's live presence.
      parameters:
        - name: name
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: >
            Case-insensitive search by staff name. Two characters minimum, so
            the roster cannot be walked one letter at a time.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: At most this many staff.
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Matching staff.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAvailabilityResponse"

  /api/v1/guest/visit/{code}:
    get:
      operationId: guest.getVisit
      tags: [Guest Gate]
      summary: Follow a visit by its code (visitor)
      description: >
        No credential: the code the check-in returned is the credential.
        Case, spaces and dashes are ignored. The answer is the visit's status
        and nothing about who came or whom they came to see. Not rate
        limited: a code is about 79 bits, and a right guess shows only whether
        one unnamed visit was approved.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: 7KQM-3XHP-R9DW-4TNC
      responses:
        "200":
          description: The visit's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestVisitStatus"
        "404":
          description: >
            No visit with that code, including one deleted under
            `GUEST_RETENTION_DAYS` and one past the window in
            `GUEST_VISIT_CODE_TTL_MINUTES`, which answers exactly as an
            unknown code does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/guest/pending:
    get:
      operationId: guest.listPending
      tags: [Guest Gate]
      summary: List the pending guest requests this account may decide
      description: >
        Guests with PENDING_VERIFICATION status that this account may decide: the ones
        targeting it, and with GUEST_ADMIN_CAN_DECIDE on also those an admin may decide,
        which for an ORG_ADMIN is the whole organization's queue. Unpaginated.
      responses:
        "200":
          description: Pending guest requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestResponse"

  /api/v1/guest/overstays:
    get:
      operationId: guest.listOverstays
      tags: [Guest Gate]
      summary: List the approved visits that have run past their end
      description: >
        Longest over first, which is the desk's other list: who was let in and
        has not been dealt with since. The same reach as the decision, so for an
        ORG_ADMIN with GUEST_ADMIN_CAN_DECIDE on it is the whole organization's.
        Nothing here has been revoked; each row says the time is up, and a person
        decides whether to extend it or to go and find them. Empty while
        GUEST_VISIT_LENGTH_MINUTES is 0, since then no visit has an end.
        Unpaginated, as /guest/pending is.
      responses:
        "200":
          description: Approved visits past their end.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestResponse"

  /api/v1/guest/{entry_id}/decide:
    patch:
      operationId: guest.decide
      tags: [Guest Gate]
      summary: Accept or decline a guest visit
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestDecisionRequest"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Decision recorded. The kiosk reads it from `/guest/visit/{code}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/LogVerificationState"
                  guest:
                    type: string
                    description: The visitor's name.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            No such entry, or the visitor asked for somebody else. By default only the
            staff member the visitor named may decide; with GUEST_ADMIN_CAN_DECIDE on an
            ORG_ADMIN may decide any visit and a UNIT_ADMIN those meant for their own unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/guest/{entry_id}/extend:
    patch:
      operationId: guest.extendVisit
      tags: [Guest Gate]
      summary: Give an approved visit longer
      description: >
        Whoever could have decided the visit can extend it, on the reasoning that
        a desk which may let somebody in may also let them stay. The extension
        runs from whichever is later, now or the end the visit already has, so a
        visit half an hour over gets the full grant rather than a window that has
        already gone. There is no limit on how many times: this bounds one grant,
        and the audit record of each extension is what an organization gets in
        place of a ceiling on the whole visit.
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestExtensionRequest"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: The visit's new end.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: VISIT_EXTENDED
                  guest:
                    type: string
                    description: The visitor's name.
                  visit_expires_at:
                    type: string
                    format: date-time
                    description: When the visit is now over.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            No such entry, or one this account could not have decided either.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The visit is not approved, or it is approved with no end to move,
            which is any visit approved while GUEST_VISIT_LENGTH_MINUTES was 0.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Longer than GUEST_VISIT_EXTENSION_MAX_MINUTES, refused rather than
            quietly trimmed so that a desk which meant 30 and typed 300 hears
            about it. Also every extension when that setting is 0.
            A key reused with a different request is `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Ingestion ─────────────────────────────
  /api/v1/ingestion/upload-csv:
    post:
      operationId: ingestion.uploadCsv
      tags: [Ingestion]
      summary: Bulk import schedule from CSV
      description: >
        Requires `ORG_ADMIN`. The matrix rewrites activities and
        registrations across every unit, so a unit-scoped admin cannot
        upload it.
        The CSV must contain these columns (case-sensitive):
        `member_id`, `member_name`, `member_email`, `activity_code`, `activity_title`,
        `unit`, `day_of_week_index` (ISO 8601: 1=Monday .. 7=Sunday), `time_window_start` (HH:MM),
        `time_window_end` (HH:MM), `lead_id`, `room`.
        A row's weekday becomes the rule FREQ=WEEKLY;BYDAY=.. on its slot,
        starting on the first such date in the cycle.

        Creates/updates: Users, ActivityOfferings, StructuralMasterSlots, ActivityRegistrations.
        Idempotent, re-uploading the same CSV is safe: an existing member
        keeps their password.


        Removes nothing unless `remove_missing` is set. Slots and
        enrollments the file does not mention come back in `not_in_file` for
        somebody to act on, which is what makes a partial upload safe. With
        `remove_missing=true` the upload also removes exactly those, and
        reports what it removed in `removed` and what it could not remove in
        `not_removed`. They are the rows of this cycle, in the units the file
        names, that the file does not list; a unit the file does not name, or
        another cycle, is never touched. A slot goes the way
        `DELETE /schedule/slots/{id}` removes one: its days from today on are
        withdrawn and its past days stay. A slot with attendance or a note on
        a day ahead is left and listed in `not_removed` with the reason,
        and the rest of the import carries on. An enrollment goes the way
        `DELETE /schedule/activities/{id}/enrollments/{member_id}` removes
        one, and the attendance already recorded for the member stays. The
        removal is part of the import's transaction, and the rows are checked
        before the removal runs, so a row that needs a room a missing slot
        holds is refused: upload without the option first, or remove that
        slot yourself.


        A row that would put a class in a room already taken for that window,
        by a booking, by another class, or by a day already generated onto
        it, is refused with 422 and the whole file is rolled back, which is
        what every other bad row in an import does. Rows are checked against
        each other as well as against what is already stored, so one file
        cannot put two classes in one room at one hour. The check only looks
        where a row would actually move a class, so re-uploading a file that
        describes the timetable as it already stands is not refused by what
        is sitting on it.


        A closed cycle changes two of those three. Its slots occupy nothing,
        so an upload into one is not checked against the bookings or against
        the rest of the timetable, the same way a slot in a closed cycle does
        not block a booking. The days already generated are checked either
        way, because a correction is copied onto them whatever the cycle says
        and the database refuses to move one onto a room something else is
        holding.

        Each new member costs a bcrypt hash on the request thread, about
        half a second, so a file creating more than roughly 100 new
        members will exceed the 60s client and proxy timeouts. Split it.
      parameters:
        - name: cycle_id
          in: query
          required: true
          schema:
            type: integer
          description: Target planning cycle ID.
        - name: remove_missing
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >
            Also remove the slots and enrollments the response lists in
            `not_in_file`. Off by default, and with it off the upload removes
            nothing and `removed` and `not_removed` come back empty.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
        "400":
          description: The upload is not named `.csv`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: >
            The file is larger than `CSV_UPLOAD_MAX_MB` (25 MB unless the
            instance sets it), and nothing was imported. Behind the bundled
            nginx a request over 25 MB is refused by nginx itself, also with
            413 but with an HTML body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The file was refused and nothing was saved. `detail` says why, and
            names the line where the file is at fault: a missing column, an
            unparseable time, an address already belonging to somebody else, a
            room already taken for that window, a lead who has no account, a
            member or lead who has been deactivated. Where the failure is the
            server's rather than the file's, `detail` says only that the import
            failed and that the reason is in the server log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/ingestion/generate-ledger:
    post:
      operationId: ingestion.generateLedger
      tags: [Ingestion]
      summary: Trigger daily ledger generation
      description: >
        Requires `ORG_ADMIN`. Generates `DailyLedger` rows from
        `StructuralMasterSlot` for a given date, tomorrow by default. The
        same job the nightly cron runs. Safe to re-run: a day already written
        for a slot is skipped.


        A day is skipped as well where the room is already taken for part of
        that window by another day. Two slots on one room at one hour is a
        state the API refuses to create, and a database holding one anyway
        materializes the slot that was put on the timetable first and drops
        the other. The dropped day is written to the server log naming the
        slot, the date and the room. It is not in this response.
      parameters:
        - name: target_date
          in: query
          required: false
          description: Date to generate. Defaults to tomorrow.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Generation complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: generated
                  date:
                    type: string
                    format: date
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Admin ─────────────────────────────────
  /api/v1/admin/export:
    get:
      operationId: admin.export
      tags: [Admin]
      summary: The organization's data as one archive
      description: >
        Requires `ORG_ADMIN`; an API key needs `admin:read`. A zip holding
        `manifest.json` and one JSON Lines file per table, described in
        docs/portability.md, with the caller's organization's rows only.
        `chronos-engine export` writes every organization. Password hashes, API key hashes, calendar feed
        tokens and visit code hashes are always left out; an archive with them
        comes only from `chronos-engine export --include-secrets`. Refresh
        tokens and the signing key are never in it. Every export is written to
        the audit log, although it is a read. `chronos-engine import` loads the
        archive into an empty database.
      responses:
        "200":
          description: The archive, as an attachment named chronos-ledger-export.zip.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Calendar Sync ─────────────────────────
  /api/v1/audit/:
    get:
      operationId: audit.list
      tags: [Audit]
      summary: Writes made through the API, newest first
      description: >
        Requires `ORG_ADMIN`; an API key needs `audit:read`. One record per
        request under `/api/v1` with a method other than GET, HEAD or OPTIONS,
        and one per GET of the conflict report (`schedule.listConflicts`),
        including refused ones. Bodies are never stored. `from` and `to` are
        dates in the organization's timezone, both included.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The records.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/changes/:
    get:
      operationId: changes.list
      tags: [Changes]
      summary: What has changed about the rooms and the bookings
      description: >
        Requires `ORG_ADMIN`; an API key needs `changes:read`. For a system
        that keeps its own copy of the rooms and the bookings: the websocket
        cannot tell it anything, because those notices go to a signed-in socket
        and a service behind another firewall has none, and re-reading every
        room on a timer costs the building rather than the change.


        One entry per row, not one per change. A room renamed to Bedroom and
        then to Living Room is one entry saying Living Room, because a consumer
        catching up wants where things ended and not the walk. `full=true`
        returns the walk: every marker, oldest first, with no row state.


        Send `next_cursor` back as `since`. An entry can arrive twice, after a
        crash between a write and the poll that read it, or because a row
        changed again while the page was being built; applying an entry is
        replacing a row with what the row already says, so no bookkeeping is
        needed for that.


        An entry can also be missed, which is the one thing to plan around.
        The cursor is the marker's own id, handed out when the row is inserted
        and not when it commits, so two writes that commit in the other order
        leave a gap: a poll that reads the later id and stores it does not come
        back for the earlier one. So re-read the rooms and the bookings in full
        on a slow timer. That is needed anyway, because the feed records only
        from the moment it was switched on.


        A page as long as `limit` means there is probably more, so poll again
        rather than waiting for the timer.


        The role is higher than reading the rooms takes because a booking
        carries what it is for, which the availability calendar withholds from
        everyone but the account that made it. This hands the booking over
        whole, so it sits where the audit log sits.
      parameters:
        - name: since
          in: query
          required: false
          description: The cursor the last poll returned. 0 is from the beginning.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: At most this many entries.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: full
          in: query
          required: false
          description: >
            Every marker rather than one entry per row, and no row state.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >
            The changes, oldest first, and the cursor to send next time. Empty
            with the cursor handed back unchanged when nothing has changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeFeed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: >
            The feed is off, which is the default. `CHANGE_FEED_ENABLED=true`
            starts recording; changes made while it was off were not recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Webhooks ──────────────────────────────
  /api/v1/webhooks/:
    get:
      operationId: webhooks.list
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:read`. Every
        subscription, oldest first, without its secrets. docs/webhooks.md
        describes what is sent, how it is signed and how failures are retried.
      responses:
        "200":
          description: Every subscription.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: webhooks.create
      tags: [Webhooks]
      summary: Subscribe a URL to changes
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. Events are
        made from the change feed, so the feed has to be on. The subscription
        starts at the newest change and is sent nothing that happened before
        it existed: read the rooms and the bookings in full once, as a change
        feed consumer does.


        The signing secret is in the response and nowhere else. An
        Idempotency-Key is ignored here, because keeping the response would
        keep the secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
      responses:
        "201":
          description: Subscribed. The `secret` field will not be shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            `WEBHOOK_URL_REFUSED` for a URL that may not receive webhooks
            (not HTTPS, an internal address, credentials in the URL), or
            `VALIDATION_FAILED` for an unknown event type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The change feed is off, so there would be nothing to send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/{subscription_id}:
    get:
      operationId: webhooks.get
      tags: [Webhooks]
      summary: Get a webhook subscription
      description: Requires `ORG_ADMIN`; an API key needs `webhooks:read`.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The subscription, without its secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: webhooks.update
      tags: [Webhooks]
      summary: Change a webhook subscription
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. New event
        types apply to changes fanned out from now on. Switched off, a
        subscription keeps its place and sends nothing; switched back on, it
        sends what happened in between.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookUpdate"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            `WEBHOOK_URL_REFUSED` for a URL that may not receive webhooks, or
            `VALIDATION_FAILED` for an unknown event type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: webhooks.delete
      tags: [Webhooks]
      summary: Delete a webhook subscription
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. Stops
        sending at once and removes the subscription with its deliveries and
        their attempts.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{subscription_id}/rotate-secret:
    post:
      operationId: webhooks.rotateSecret
      tags: [Webhooks]
      summary: Issue a new signing secret
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. The new
        secret is in the response and nowhere else. The old one keeps signing
        alongside it for 24 hours, or until it is removed, so every send in
        that time carries two signatures and receivers can switch over at
        their own pace. An Idempotency-Key is ignored here, for the reason it
        is on create.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rotated. The `secret` field will not be shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `WEBHOOK_SECRET_LIMIT`: two secrets are already live. Remove the
            previous one first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/{subscription_id}/previous-secret:
    delete:
      operationId: webhooks.removePreviousSecret
      tags: [Webhooks]
      summary: Stop signing with the previous secret
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. For when
        every receiver has moved to the new secret before the 24 hours are
        up. Nothing to remove is not an error.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Only the current secret signs now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{subscription_id}/resume:
    post:
      operationId: webhooks.resume
      tags: [Webhooks]
      summary: Resume a paused subscription
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. Clears the
        pause and the failure count. Nothing is skipped: what changed while it
        was paused is sent, oldest first. Resuming one that is not paused
        changes nothing.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: The subscription, no longer paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{subscription_id}/deliveries:
    get:
      operationId: webhooks.listDeliveries
      tags: [Webhooks]
      summary: What was sent and what came back
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:read`. Deliveries
        newest first, each with every attempt made at it.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Deliveries, newest first.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/{subscription_id}/deliveries/{delivery_id}/redeliver:
    post:
      operationId: webhooks.redeliver
      tags: [Webhooks]
      summary: Send a delivery again
      description: >
        Requires `ORG_ADMIN`; an API key needs `webhooks:write`. The delivery
        goes back in the queue with a fresh set of attempts and is sent on the
        worker's next pass, with the same `webhook-id` and body and a new
        timestamp and signature.
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: integer
        - name: delivery_id
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sync/feed-token:
    get:
      operationId: sync.getFeedToken
      tags: [Calendar Sync]
      summary: Get the caller's calendar feed token
      description: >
        Returns the token that keys the caller's iCalendar feed, minting one on
        the first call. `feed_path` is the path to subscribe, already built from
        the token. The token is the only thing guarding the feed, so hand it out
        the way a password is handed out.
      responses:
        "200":
          description: The feed token and the path built from it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sync/feed-token/rotate:
    post:
      operationId: sync.rotateFeedToken
      tags: [Calendar Sync]
      summary: Replace the caller's calendar feed token
      description: >
        Mints a new token and invalidates the old one. Every calendar app
        subscribed to the old path stops updating and has to be resubscribed,
        which is the point: this is what to call when a feed URL has leaked.
      responses:
        "200":
          description: The new feed token and the path built from it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedToken"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sync/user-feed/{feed_token}.ics:
    get:
      operationId: sync.getFeed
      tags: [Calendar Sync]
      summary: iCalendar feed for a user (rolling 37-day window)
      description: >
        Subscribe this URL directly in Google Calendar, Apple Calendar, or Outlook.
        Returns standard iCalendar (text/calendar) content.
        Staff feed includes all sessions where they are active or substitute lead.
        Member feed includes all registered activities.
        Timed sessions are written as UTC instants (DTSTART and DTEND end in Z),
        converted from the organization's wall clock through ORG_TIMEZONE, so a
        subscriber reading the feed from anywhere sees the session at the moment
        it happens. An entry with no window of its own is an all-day date and
        carries no zone, because a date reads the same everywhere. That is an
        ad-hoc day nobody gave a time to, or a day generated before the ledger
        carried its own window.
      parameters:
        - name: feed_token
          in: path
          required: true
          schema:
            type: string
          description: >
            The token from `GET /api/v1/sync/feed-token`, not a user id. The
            feed itself is unauthenticated so a calendar app can poll it, which
            leaves the token as the only thing guarding it.
      responses:
        "200":
          description: iCalendar feed.
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\nVERSION:2.0\n..."
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ── WebSocket ─────────────────────────
  /api/v1/ws/stats:
    get:
      operationId: ws.getStats
      tags: [WebSocket]
      summary: Count of people with an open websocket, on every instance
      description: >
        Requires `ORG_ADMIN`. The count is of the caller's organization, and
        there is nothing in it a unit admin could be shown only their own
        share of. A person counts once however many instances they are connected to. The
        other instances' figures can be up to 15 seconds old, and an instance
        that cannot reach Redis counts only its own sockets.
      responses:
        "200":
          description: Open connection count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  online_connections:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Health ────────────────────────────────
  /health:
    get:
      operationId: health.check
      tags: [System]
      summary: Health check
      security: []
      description: >
        Liveness: answers without touching the database. Also names the
        running release and the version of the schema its models describe.
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: chronos-ledger
                  version:
                    type: string
                    example: "0.13.0"
                  schema_version:
                    type: string
                    example: "1"
                    description: >
                      Bumped by the maintainers when the models change. There
                      are no migrations: a database built by one schema
                      version is not upgraded to the next.

  /health/ready:
    get:
      operationId: health.ready
      tags: [System]
      summary: Readiness check
      security: []
      description: >
        Runs `SELECT 1` against PostgreSQL and pings Redis. Fails with 503 only
        when PostgreSQL does not answer: without Redis the app keeps working,
        so Redis being down is reported but still ready. The container
        healthchecks use this route.
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: PostgreSQL did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

# ─────────────────────────────────────────────
# WebSocket (informational, not an HTTP path)
# ─────────────────────────────────────────────
# WebSocket endpoint: ws://<server>/ws
#
# The server accepts the socket, then waits five seconds for one frame naming
# the token:
#
#   { "event": "AUTH", "payload": { "token": "<jwt>" } }
#
# It answers { "event": "AUTHENTICATED", "payload": {} } and begins routing
# domain events to this client. A refused token closes with 4003; silence past
# the five seconds closes with 4008. The token is checked the way an HTTP
# request's is, so one naming an account that is gone, or an admin who has not
# chosen a password yet, is refused here too.
#
# Not a query parameter on purpose: a query string lands in the proxy's access
# log and the browser's history, and is sent onward as a Referer.
#
# Inbound frames (server → client):
#
#   { "event": "ABSENCE_APPROVAL_REQUIRED",
#     "payload": { "log_id": 12, "from": "Prof. A", "date": "2026-06-15" } }
#
#   { "event": "ABSENCE_DECISION",
#     "payload": { "log_id": 12, "decision": "VERIFIED_APPROVED" } }
#
#   { "event": "GUEST_HANDSHAKE_REQ",
#     "payload": { "transaction_reference": 5, "guest_name": "J. Smith",
#                  "organization": "TechCorp", "intent": "..." } }
#
#   { "event": "GUEST_VISIT_EXPIRED",
#     "payload": { "transaction_reference": 5, "guest_name": "J. Smith",
#                  "visit_expires_at": "2026-09-12T07:31:07Z" } }
#   Sent once per overrun, within five minutes of the end passing, to the
#   target staff and to whoever decided the visit. GET /guest/overstays is
#   the same list for a desk that had no socket open at the time.
#
# The AUTH frame is the only thing a client sends upstream.
