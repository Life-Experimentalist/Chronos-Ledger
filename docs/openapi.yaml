  # ── Ingestion ─────────────────────────────
  /ingestion/upload-csv:
    post:
      tags: [Ingestion]
      summary: Bulk import schedule from CSV
      description: >
        Requires `SUPER_ADMIN`. The matrix rewrites activities and
        registrations across every unit, so a unit-scoped admin cannot
        upload it.
        The CSV must contain these columns (case-sensitive):
        `member_id`, `member_name`, `member_email`, `activity_code`, `activity_title`,
        `unit`, `day_of_week_index` (ISO 8601: 1=Monday .. 7=Sunday), `time_window_start` (HH:MM),
        `time_window_end` (HH:MM), `lead_id`, `room`.

        Creates/updates: Users, ActivityOfferings, StructuralMasterSlots, ActivityRegistrations.
        Idempotent, re-uploading the same CSV is safe: an existing member
        keeps their password.


        Never removes. Slots and enrollments the cycle holds that the file
        does not mention come back in `not_in_file` for somebody to act on,
        which is what makes a partial upload safe.


        A row that would put a class in a room already held for that window
        is refused with 422 and the whole file is rolled back, which is what
        every other bad row in an import does. The check only looks where a
        row would actually move a class, so re-uploading a file that
        describes the timetable as it already stands is not refused by a hold
        sitting on it.

        Each new member costs a bcrypt hash on the request thread, about
        half a second, so a file creating more than roughly 100 new
        members will exceed the 60s client and proxy timeouts. Split it.
      parameters:
        - name: cycle_id
          in: query
          required: true
          schema:
            type: integer
          description: Target planning cycle ID.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
        "400":
          description: CSV format error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ingestion/generate-ledger:
    post:
      tags: [Ingestion]
      summary: Trigger daily ledger generation
      description: >
        Requires admin. Generates `DailyLedger` rows from `StructuralMasterSlot`
        for a given date (defaults to tomorrow). Safe to re-run, existing rows are skipped.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target_date:
                  type: string
                  format: date
                  description: Date to generate. Defaults to tomorrow.
      responses:
        "200":
          description: Generation complete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated:
                    type: integer
                  skipped:
                    type: integer
                  target_date:
                    type: string
                    format: date
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Calendar Sync ─────────────────────────
  /sync/user-feed/{user_id}.ics:
    get:
      tags: [Calendar Sync]
      summary: iCalendar feed for a user (rolling 37-day window)
      description: >
        Subscribe this URL directly in Google Calendar, Apple Calendar, or Outlook.
        Returns standard iCalendar (text/calendar) content.
        Staff feed includes all sessions where they are active or substitute lead.
        Member feed includes all registered activities.
        Timed sessions are written as UTC instants (DTSTART and DTEND end in Z),
        converted from the organization's wall clock through ORG_TIMEZONE, so a
        subscriber reading the feed from anywhere sees the session at the moment
        it happens. Entries with no master slot are all-day dates and carry no
        zone, because a date reads the same everywhere.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: iCalendar feed.
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\nVERSION:2.0\n..."
        "404":
          $ref: "#/components/responses/NotFound"

