[package]
name = "chronosledger"
# Moves with the server: release-please writes this line (release-please-config.json),
# and `chronos upgrade` refuses a server newer than the CLI running it.
version = "0.17.0"
edition = "2024"
description = "Install, upgrade, back up and diagnose a Chronos Ledger server"
license = "Apache-2.0"
repository = "https://github.com/Life-Experimentalist/Chronos-Ledger"
homepage = "https://chronos.vkrishna04.me"
documentation = "https://chronos.vkrishna04.me/cli"
readme = "README.md"
keywords = ["scheduling", "attendance", "docker-compose", "cli", "self-hosted"]
categories = ["command-line-utilities"]
rust-version = "1.88"
# Only what `cargo install` needs: the source and the lockfile it is told to
# honour with --locked. The tests are inline, so nothing else belongs here.
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "README.md"]

[package.metadata.binstall]
# cargo-binstall fetches the bare binaries that release.yml (cli-build) attaches
# to each release, named chronos-vX.Y.Z-<os>-<arch>[.exe]. One override per
# build target; a target with no override falls back to a source build.
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-linux-x64"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-linux-arm64"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-darwin-x64"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-darwin-arm64"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-windows-x64.exe"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/chronos-v{ version }-windows-arm64.exe"
pkg-fmt = "bin"

[[bin]]
name = "chronos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
getrandom = "0.4"
# Only `self update` and `upgrade` without --to open a socket. rustls with bundled
# roots, so the static musl build links no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
